const FORMAT_OPTIONS = [
  { value: '', label: 'OpenAI 兼容', path: '/chat/completions' },
  { value: 'anthropic', label: 'Anthropic', path: '/messages' },
  { value: 'unlimited_api_chat', label: 'Unlimited API', path: '/api/chat' },
];
const EFFORT_OPTIONS = ['', 'low', 'medium', 'high', 'xhigh', 'max'];
const DISPLAY_OPTIONS = ['', 'omitted', 'summarized'];

function ModelTagEditor({ models, onChange, display, invalid, placeholder }) {
  const [text, setText] = useState('');
  const inputRef = useRef(null);
  const add = raw => {
    const items = String(raw).split(/[\r\n,，]+/).map(s => s.trim()).filter(Boolean);
    if (!items.length) return;
    const seen = new Set(models.map(display));
    const next = [...models];
    for (const it of items) {
      const d = display(it);
      if (seen.has(d)) continue;
      seen.add(d);
      next.push(it);
    }
    onChange(next);
    setText('');
  };
  const removeAt = i => onChange(models.filter((_, idx) => idx !== i));
  return html`
    <div class=${cx('tag-editor', invalid && 'invalid')} onClick=${e => { if (e.target === e.currentTarget) inputRef.current?.focus(); }}>
      ${models.length ? html`
        <div class="chips">
          ${models.map((m, i) => html`
            <span class="chip mono" key=${`${m}-${i}`} title=${display(m)}>
              <span>${display(m)}</span>
              <button type="button" class="chip-x" title="移除" onClick=${() => removeAt(i)}><${Icon} name="x" /></button>
            </span>`)}
        </div>` : null}
      <input ref=${inputRef} class="tag-input" value=${text} placeholder=${placeholder} spellcheck="false"
        onInput=${e => setText(e.currentTarget.value)}
        onKeyDown=${e => {
          if (e.key === 'Enter' || e.key === ',' || e.key === '，') { e.preventDefault(); add(text); }
          else if (e.key === 'Escape' && text) { e.stopPropagation(); setText(''); }
        }}
        onPaste=${e => {
          const pasted = e.clipboardData?.getData('text') || '';
          if (/[\r\n,，]/.test(pasted)) { e.preventDefault(); add(`${text}${pasted}`); }
        }}
        onBlur=${() => { if (text.trim()) add(text); }} />
      <div class="tag-editor-foot">
        <span class="xs faint">${models.length} 个模型 · 回车或逗号添加，可直接粘贴列表</span>
        <span class="spacer"></span>
        <${Button} size="xs" variant="ghost" icon="copy" disabled=${!models.length} onClick=${() => copyText(models.map(display).join(', '), { label: '模型列表' })}>复制<//>
        <${Button} size="xs" variant="ghost" icon="trash" disabled=${!models.length} onClick=${async () => {
          if (await confirmDialog({ title: '清空模型', message: `清空当前 ${models.length} 个模型？保存前都不会生效。`, okText: '清空', danger: true })) onChange([]);
        }}>清空<//>
      </div>
    </div>`;
}

function ChannelEditor({ editKey = '', close, requestClose, setGuard }) {
  const isNew = !editKey;
  const channels = appStore.get().channels;
  const orig = isNew ? {} : (channels[editKey] || {});
  const origPrefix = isNew ? '' : channelPrefixOf(editKey, orig);
  const knownFormat = FORMAT_OPTIONS.some(o => o.value === (orig.format === 'openai' ? '' : orig.format || ''));

  const initial = useMemo(() => ({
    name: orig.name || '',
    prefix: origPrefix,
    url: orig.base_url || '',
    website: orig.website || '',
    enabled: isEnabled(orig),
    format: orig.format === 'openai' ? '' : (orig.format || ''),
    anthropicVersion: orig.anthropic_version || '2023-06-01',
    thinking: orig.anthropic_thinking_type || 'off',
    budget: String(orig.anthropic_thinking_budget_tokens || 32000),
    effort: orig.anthropic_output_effort || '',
    display: orig.anthropic_thinking_display || '',
    cache: Boolean(orig.prompt_cache_enabled),
    ttl: orig.prompt_cache_ttl === '5m' ? '5m' : '1h',
    truncate: Boolean(orig.auto_truncate),
    marker: orig.auto_truncate_marker || DEFAULT_TRUNCATE_MARKER,
    truncPrompt: orig.auto_truncate_prompt || '',
    keyStrategy: orig.key_strategy === 'sticky' ? 'sticky' : 'round_robin',
    keysText: '',
    models: Array.isArray(orig.models) ? [...orig.models] : [],
  }), []);

  const [f, setF] = useState(initial);
  const [errors, setErrors] = useState({});
  const [probe, setProbe] = useState({ loading: false, models: null, error: '' });
  const [saving, setSaving] = useState(false);
  const set = (k, v) => { setF(p => ({ ...p, [k]: v })); if (errors[k]) setErrors(e => ({ ...e, [k]: '' })); };

  const fRef = useRef(f);
  fRef.current = f;
  const savingRef = useRef(false);
  useEffect(() => {
    setGuard(async () => {
      if (savingRef.current) return false;
      if (JSON.stringify(fRef.current) === JSON.stringify(initial)) return true;
      return confirmDialog({ title: '放弃修改？', message: '有尚未保存的修改，确定要关闭编辑器吗？', okText: '放弃修改', danger: true });
    });
  }, []);

  const prefix = f.prefix.trim();
  const displayModel = m => normalizeModelsForPrefix([m], prefix, origPrefix)[0];
  const finalModels = uniq(f.models.map(displayModel));
  const finalKey = isNew ? (prefix || makeChannelKey(f.name, f.url, channels)) : (prefix || editKey);
  const renaming = !isNew && finalKey !== editKey;
  const conflict = finalKey !== editKey && Boolean(channels[finalKey]);
  const newKeys = parseKeyList(f.keysText);
  const origKeys = channelKeysOf(orig);
  const origKeyStats = channelKeyStats(orig);
  const endpoint = f.url.trim() ? `${f.url.trim().replace(/\/+$/, '')}${formatEndpoint(f.format)}` : '';

  const validate = () => {
    const e = {};
    if (!f.name.trim()) e.name = '请填写渠道名称';
    if (/[\s[\]]/.test(prefix)) e.prefix = '前缀不能包含空格或方括号';
    else if (conflict) e.prefix = `渠道 key「${finalKey}」已被其他渠道使用，请换一个前缀`;
    if (!f.url.trim()) e.url = '请填写 API 地址';
    else if (!isHttpUrl(f.url)) e.url = 'API 地址需以 http:// 或 https:// 开头';
    if (f.website.trim() && !/^https?:\/\//i.test(f.website.trim())) e.website = '官网地址需以 http:// 或 https:// 开头';
    if (isNew && !newKeys.length) e.keysText = '新渠道至少需要一个上游 Key';
    if (!finalModels.length) e.models = '至少需要一个模型';
    if (f.format === 'anthropic' && f.thinking === 'enabled' && !(Number(f.budget) > 0)) e.budget = '请填写正整数';
    return e;
  };

  const doProbe = async () => {
    const url = f.url.trim();
    const key = isNew ? newKeys[0] : (activeKeysOf(orig)[0] || origKeys[0]);
    if (!url || !key) { setProbe({ loading: false, models: probe.models, error: '请先填写 API 地址和至少一个 Key' }); return; }
    setProbe(p => ({ ...p, loading: true, error: '' }));
    try {
      const d = await api.post('/api/probe-models', { base_url: url, key, format: f.format, channelKey: isNew ? '' : editKey });
      const list = uniq((d.models || []).map(String));
      setProbe({ loading: false, models: list, error: list.length ? '' : '上游没有返回任何模型' });
    } catch (err) {
      setProbe({ loading: false, models: null, error: err.message });
    }
  };

  const bare = m => stripOwnModelPrefix(stripOwnModelPrefix(m, origPrefix), prefix).toLowerCase();
  const probeItems = useMemo(() => (probe.models || []).map(m => ({ value: m, label: m, mono: true })), [probe.models]);
  const currentBare = new Set(f.models.map(bare));
  const probeSelected = new Set((probe.models || []).filter(m => currentBare.has(bare(m))));
  const onProbePick = next => {
    const removed = new Set([...probeSelected].filter(m => !next.has(m)).map(bare));
    const added = [...next].filter(m => !probeSelected.has(m));
    set('models', [...f.models.filter(m => !removed.has(bare(m))), ...added]);
  };

  const save = async () => {
    const e = validate();
    setErrors(e);
    const first = Object.values(e).find(Boolean);
    if (first) {
      toast(first, 'err');
      setTimeout(() => document.querySelector('.drawer .invalid, .drawer .field-error')?.scrollIntoView({ block: 'center', behavior: 'smooth' }), 30);
      return;
    }
    savingRef.current = true;
    setSaving(true);
    try {
      let keys = newKeys;
      if (!isNew) {
        // 保存前重新拉取最新配置，避免覆盖掉其它页面 / 会话里刚导入或删除的 Key
        await loadConfig();
        const fresh = appStore.get().channels[editKey];
        if (!fresh) throw new ApiError('原渠道已不存在，可能已被删除或重命名');
        keys = channelKeysOf(fresh);
      }
      const fmt = f.format;
      const origFormat = orig.format || '';
      // 后端在 format 为空时会沿用旧值，因此从 Anthropic / Unlimited 切回 OpenAI 时需显式传 openai
      const formatField = fmt || (origFormat && origFormat !== 'openai' ? 'openai' : '');
      const payload = {
        channelKey: finalKey,
        name: f.name.trim(),
        base_url: f.url.trim(),
        key: keys[0] || '',
        keys,
        models: finalModels,
        model_prefix: prefix,
        website: f.website.trim(),
        enabled: f.enabled,
        auto_truncate: f.truncate,
        auto_truncate_marker: f.marker.trim() || DEFAULT_TRUNCATE_MARKER,
        auto_truncate_prompt: f.truncPrompt || '',
        key_strategy: f.keyStrategy,
        ...(formatField ? { format: formatField } : {}),
        ...(fmt === 'anthropic' ? { anthropic_version: f.anthropicVersion.trim() || '2023-06-01' } : {}),
        prompt_cache_enabled: f.cache,
        prompt_cache_ttl: f.cache ? f.ttl : '1h',
        anthropic_thinking_type: fmt === 'anthropic' ? f.thinking : 'off',
        anthropic_thinking_budget_tokens: Math.floor(Number(f.budget)) || 32000,
        anthropic_output_effort: f.effort || '',
        anthropic_thinking_display: f.display || '',
        isNew,
        ...(isNew ? {} : { previousChannelKey: editKey }),
      };
      await api.post('/api/config/save', payload);
      toast(isNew ? `渠道「${payload.name}」已添加` : `渠道「${payload.name}」已保存${renaming ? `，key 已改为 ${finalKey}` : ''}`);
      savingRef.current = false;
      close(finalKey);
      await refreshAll();
      const route = routeStore.get();
      if (isNew) navigate('channels', finalKey);
      else if (renaming && route.route === 'channels' && route.arg === editKey) navigate('channels', finalKey);
      bumpKeyDash(finalKey);
    } catch (err) {
      reportError(err, '保存失败：');
    } finally {
      savingRef.current = false;
      setSaving(false);
    }
  };

  const formatOptions = knownFormat ? FORMAT_OPTIONS : [...FORMAT_OPTIONS, { value: orig.format, label: `保持：${orig.format}`, path: '当前自定义格式' }];

  return html`
    <${Drawer} wide title=${isNew ? '添加渠道' : `编辑渠道 · ${orig.name || editKey}`} onClose=${requestClose} busy=${saving}
      footer=${html`
        <span class="foot-left">
          渠道 key：<span class="mono">${finalKey || '—'}</span>
          ${renaming ? html` <span class="warn-text">（将由 ${editKey} 重命名）</span>` : null}
        </span>
        <${Button} onClick=${requestClose} disabled=${saving}>取消<//>
        <${Button} variant="primary" icon="check" loading=${saving} onClick=${save}>${isNew ? '添加渠道' : '保存修改'}<//>`}>

      <div class="section">
        <div class="section-title"><${Icon} name="info" />基本信息</div>
        <div class="form-grid">
          <${Field} label="渠道名称" required error=${errors.name}>
            <input class=${cx('input', errors.name && 'invalid')} value=${f.name} placeholder="例如 DeepSeek 官方" onInput=${e => set('name', e.currentTarget.value)} data-autofocus />
          <//>
          <${Field} label="模型前缀" error=${errors.prefix}
            hint=${isNew
              ? `模型显示为 [前缀]模型名，同时作为渠道 key；留空则不加前缀，key 自动生成为「${finalKey}」。`
              : renaming ? `修改前缀会把渠道 key 从「${editKey}」重命名为「${finalKey}」，并同步调用 Key 的渠道限制。`
              : '模型显示为 [前缀]模型名；修改前缀会重命名渠道 key。'}>
            <input class=${cx('input mono', errors.prefix && 'invalid')} value=${f.prefix} placeholder="例如 ds" onInput=${e => set('prefix', e.currentTarget.value)} />
          <//>
          <${Field} span2 label="API 地址" required error=${errors.url} hint=${endpoint ? html`请求将发往 <span class="mono">${endpoint}</span>` : '通常以 /v1 结尾，例如 https://api.example.com/v1'}>
            <input class=${cx('input mono', errors.url && 'invalid')} value=${f.url} placeholder="https://api.example.com/v1" onInput=${e => set('url', e.currentTarget.value)} />
          <//>
          <${Field} label="渠道官网（可选）" error=${errors.website} hint="填写后会在渠道详情里显示官网链接。">
            <input class=${cx('input mono', errors.website && 'invalid')} value=${f.website} placeholder="https://example.com" onInput=${e => set('website', e.currentTarget.value)} />
          <//>
          <${Field} label="状态">
            <div style="padding-top:6px"><${Switch} checked=${f.enabled} onChange=${v => set('enabled', v)} label="启用渠道" hint="停用后模型不可调用，配置会保留" /></div>
          <//>
        </div>
      </div>

      <div class="section">
        <div class="section-title"><${Icon} name="code" />接口格式</div>
        <div class="format-options">
          ${formatOptions.map(o => html`
            <button type="button" key=${o.value} class=${cx('format-opt', f.format === o.value && 'active')} onClick=${() => set('format', o.value)}>
              <b>${o.label}</b><span>${o.path}</span>
            </button>`)}
        </div>
        ${f.format === 'anthropic' ? html`

function openKeyImport(ckey, existingKeys = [], after) {
  return openOverlay(KeyImportDialog, { ckey, existing: existingKeys, after });
}

function KeyImportDialog({ ckey, existing, after, close }) {
  const [text, setText] = useState('');
  const fileRef = useRef(null);
  const parsed = parseKeyList(text);
  const existingSet = new Set(existing);
  const fresh = parsed.filter(k => !existingSet.has(k));
  const dup = parsed.length - fresh.length;

  const submit = async () => {
    if (!parsed.length) { toast('请粘贴至少一个 Key', 'err'); return; }
    if (!fresh.length) { toast('这些 Key 都已存在，无需导入', 'info'); return; }
    const d = await api.post('/api/config/channel-keys/import', { channelKey: ckey, keys: text });
    toast(`已导入 ${d.added || 0} 个新 Key（共 ${d.total ?? '—'} 个）`);
    close(true);
    await after?.();
  };

  const readFile = async e => {
    const file = e.currentTarget.files?.[0];
    e.currentTarget.value = '';
    if (!file) return;
    const content = await file.text();
    setText(prev => (prev.trim() ? `${prev.trim()}\n${content}` : content));
  };

  return html`
    <${Modal} size="md" title="导入 Key" sub=${`渠道：${channelName(ckey)}`} onClose=${() => close(false)} footer=${html`
      <span class="foot-left">${parsed.length ? `识别 ${parsed.length} 个 · 新增 ${fresh.length}${dup ? ` · 已存在 ${dup}` : ''}` : '支持粘贴或从 .txt 文件读取'}</span>
      <${Button} onClick=${() => close(false)}>取消<//>
      <${Button} variant="primary" icon="upload" disabled=${!fresh.length} onClick=${submit}>导入 ${fresh.length || ''} 个<//>`}>
      <${Field} label="Key 列表" hint="每行一个，或用逗号分隔；自动去重，已存在的 Key 会被跳过。">
        <textarea class="textarea mono" rows="10" value=${text} placeholder=${'sk-xxxx\nsk-yyyy\nsk-zzzz'} data-autofocus
          onInput=${e => setText(e.currentTarget.value)}></textarea>
      <//>
      <div class="row" style="margin-top:10px">
        <${Button} size="sm" icon="file" onClick=${() => fileRef.current?.click()}>从文件读取<//>
        <input ref=${fileRef} type="file" accept=".txt,.csv,text/plain" class="hidden" onChange=${e => runAction(readFile, e)} />
        ${text ? html`<${Button} size="sm" variant="ghost" icon="x" onClick=${() => setText('')}>清空<//>` : null}
      </div>
    <//>`;
}

function openBatchTest(ckey, keys, { reload, source = 'filtered' } = {}) {
  const ch = appStore.get().channels[ckey];
  if (!ch?.models?.length) { toast('当前渠道没有可测试的模型', 'err'); return undefined; }
  if (!keys.length) { toast('没有可测试的 Key', 'err'); return undefined; }
  return openOverlay(BatchTestDialog, { ckey, keys: [...keys], reload, source });
}

function BatchTestDialog({ ckey, keys, reload, source, requestClose, setGuard }) {
  const ch = appStore.get().channels[ckey] || {};
  const models = Array.isArray(ch.models) ? ch.models : [];
  const [savedModel, setSavedModel] = usePref(`batchTest.model.${ckey}`, models[0]);
  const model = models.includes(savedModel) ? savedModel : models[0];
  const [conc, setConc] = usePref('batchTest.concurrency', 5);
  const [autoDisable, setAutoDisable] = useState(true);
  const [reenable, setReenable] = useState(false);
  const [onlyFail, setOnlyFail] = useState(false);
  const [run, setRun] = useState({ status: 'idle', done: 0, pass: 0, fail: 0, results: [] });
  const stopRef = useRef(false);
  const runningRef = useRef(false);
  const mounted = useMounted();

  useEffect(() => {
    setGuard(async () => {
      if (!runningRef.current) return true;
      const ok = await confirmDialog({ title: '停止测试？', message: '测试仍在进行中。关闭后将不再发起新的测试（已发出的请求会继续完成）。', okText: '停止并关闭', danger: true });
      if (ok) stopRef.current = true;
      return ok;
    });
  }, []);

  const start = async () => {
    stopRef.current = false;
    runningRef.current = true;
    const list = [];
    let pass = 0;
    let fail = 0;
    setRun({ status: 'running', done: 0, pass: 0, fail: 0, results: [] });
    await runPool(keys, async key => {
      const d = await api.post('/api/config/channel-keys/batch-test', { channelKey: ckey, model, keys: [key], concurrency: 1, autoDisable, reenable });
      return d.results?.[0] || { key, pass: false, error: 'Key 已不在该渠道中' };
    }, {
      concurrency: clamp(Math.floor(Number(conc)) || 5, 1, 20),
      shouldStop: () => stopRef.current,
      onProgress: (n, total, res, index) => {
        const r = res.ok ? res.value : { key: keys[index], pass: false, error: res.error?.message || '请求失败' };
        if (r.pass) pass++; else fail++;
        list.push(r);
        if (mounted.current) setRun({ status: stopRef.current ? 'stopping' : 'running', done: n, pass, fail, results: [...list] });
      },
    });
    runningRef.current = false;
    if (mounted.current) setRun(s => ({ ...s, status: 'done', stopped: stopRef.current }));
    await reload?.();
  };

  const running = run.status === 'running' || run.status === 'stopping';
  const failedKeys = run.results.filter(r => !r.pass).map(r => r.key);
  const shown = onlyFail ? run.results.filter(r => !r.pass) : run.results;

  return html`
    <${Modal} size="lg" title="批量测试 Key" sub=${`渠道：${ch.name || ckey} · ${keys.length} 个 Key（${source === 'selected' ? '选中项' : '当前筛选结果'}）`}
      onClose=${requestClose}
      footer=${html`
        ${run.status !== 'idle' ? html`<span class="foot-left">${running ? `进行中 ${run.done}/${keys.length}` : run.stopped ? `已停止：完成 ${run.done}/${keys.length}` : `完成：${keys.length} 个`}</span>` : null}
        ${run.status === 'done' && failedKeys.length ? html`
          <${Button} icon="copy" onClick=${() => copyText(failedKeys.join('\n'), { label: ` ${failedKeys.length} 个失败 Key` })}>复制失败 Key<//>` : null}
        ${running
          ? html`<${Button} variant="danger" icon="stop" disabled=${run.status === 'stopping'} onClick=${() => { stopRef.current = true; setRun(s => ({ ...s, status: 'stopping' })); }}>${run.status === 'stopping' ? '正在停止…' : '停止'}<//>`
          : html`<${Button} variant="primary" icon=${run.status === 'done' ? 'refresh' : 'zap'} onClick=${start}>${run.status === 'done' ? '重新测试' : '开始测试'}<//>`}`}>
      <div class="form-grid">
        <${Field} label="测试模型">
          <select class="select" value=${model} disabled=${running} onChange=${e => setSavedModel(e.currentTarget.value)}>
            ${models.map(m => html`<option value=${m}>${m}</option>`)}
          </select>
        <//>
        <${Field} label="并发数（1-20）">
          <input class="input" type="number" min="1" max="20" value=${conc} disabled=${running}
            onInput=${e => setConc(clamp(Math.floor(Number(e.currentTarget.value)) || 1, 1, 20))} />
        <//>
        <div class="span-2 row wrap" style="gap:18px">
          <${Switch} checked=${autoDisable} disabled=${running} onChange=${setAutoDisable} label="失败后自动禁用坏 Key" hint="仅对无效 / 余额不足 / 封禁等确定性错误生效" />
          <${Switch} checked=${reenable} disabled=${running} onChange=${setReenable} label="通过后恢复已禁用的 Key" />
        </div>
      </div>
      ${run.status !== 'idle' ? html`
        <div class="col" style="margin-top:16px;gap:10px">
          <${Progress} value=${run.done} max=${keys.length} tone=${run.status === 'done' ? (run.fail ? 'warn' : 'success') : ''} />
          <div class="row wrap small">
            <span class="success-text">通过 <b class="tnum">${run.pass}</b></span>
            <span class="danger-text">失败 <b class="tnum">${run.fail}</b></span>
            <span class="faint">剩余 ${Math.max(0, keys.length - run.done)}</span>
            <span class="spacer"></span>
            <${Checkbox} checked=${onlyFail} onChange=${setOnlyFail} label="只看失败" />
          </div>
          ${shown.length ? html`
            <div class="result-list">
              ${shown.map((r, i) => html`
                <div class="result-row" key=${`${r.key}-${i}`}>
                  <${KeyText} value=${r.key || ''} />
                  <${Badge} tone=${r.pass ? 'success' : 'danger'}>${r.pass ? '通过' : '失败'}<//>
                  ${r.status ? html`<${Badge} sq>${r.status}<//>` : null}
                  <span class="result-msg">${r.pass ? (r.reply || '(ok)') : (r.error || r.reason || '测试失败')}</span>
                  ${r.autoDisabled ? html`<${Badge} tone="warn">已禁用<//>` : null}
                  ${r.reenabled ? html`<${Badge} tone="info">已恢复<//>` : null}
                </div>`)}
            </div>` : html`<div class="small faint">${running ? '等待结果…' : '没有失败的 Key 🎉'}</div>`}
        </div>` : html`
        <div class="notice" style="margin-top:14px"><${Icon} name="info" />
          <div>每个 Key 会用所选模型发送一次 max_tokens=5 的 ping 请求，按并发数逐个执行，可随时停止。</div>
        </div>`}
    <//>`;
}

function clientKeyStatus(e = {}) {
  if (e.key_type === 'admin') return { code: 'admin', tone: 'accent', text: '管理 Key' };
  if (e.enabled === false) return { code: 'disabled', tone: '', text: '已停用' };
  if (e.expires_at && Date.parse(e.expires_at) <= Date.now()) return { code: 'expired', tone: 'danger', text: '已过期' };
  if (num(e.quota_limit) > 0 && num(e.quota_used) >= num(e.quota_limit)) return { code: 'exhausted', tone: 'warn', text: '额度用尽' };
  return { code: 'active', tone: 'success', text: '有效' };
}

function channelPickerItems(channels) {
  return Object.entries(channels).map(([ckey, ch]) => ({
    value: ckey,
    label: ch.name || ckey,
    sub: `${ckey}${isEnabled(ch) ? '' : ' · 已停用'}`,
  }));
}

async function saveClientKey(payload, okMsg) {
  const d = await api.post('/api/config/client-keys/save', payload);
  appStore.set({ clientKeys: Array.isArray(d.api_keys) ? d.api_keys : appStore.get().clientKeys });
  if (okMsg) toast(okMsg);
  return d;
}

async function toggleClientKey(entry) {
  await saveClientKey({
    key: entry.key,
    name: entry.name || '',
    allowed_channels: entry.allowed_channels || [],
    allowed_models: entry.allowed_models || [],
    quota_limit: num(entry.quota_limit),
    quota_used: num(entry.quota_used),
    expires_at: entry.expires_at || '',
    enabled: entry.enabled === false,
  }, entry.enabled === false ? `「${entry.name || maskKey(entry.key)}」已启用` : `「${entry.name || maskKey(entry.key)}」已停用`);
}

async function deleteClientKey(entry) {
  const ok = await confirmDialog({
    title: '删除调用 Key',
    message: `删除调用 Key「${entry.name || maskKey(entry.key)}」？\n使用该 Key 的客户端将立即无法调用。`,
    okText: '删除',
    danger: true,
  });
  if (!ok) return;
  const d = await api.post('/api/config/client-keys/delete', { key: entry.key });
  appStore.set({ clientKeys: Array.isArray(d.api_keys) ? d.api_keys : appStore.get().clientKeys.filter(e => e.key !== entry.key) });
  toast('已删除');
}

function ClientKeysPage() {
  const clientKeys = useStore(appStore, s => s.clientKeys);
  const channels = useStore(appStore, s => s.channels);
  const [q, setQ] = useSessionState('ck.q', '');
  const [filter, setFilter] = useSessionState('ck.filter', 'all');
  useNow();

  const generated = clientKeys.filter(e => e.key_type !== 'admin');
  const counts = { all: clientKeys.length, active: 0, disabled: 0, expired: 0, exhausted: 0 };
  for (const e of generated) counts[clientKeyStatus(e).code] = (counts[clientKeyStatus(e).code] || 0) + 1;
  const totalReq = clientKeys.reduce((s, e) => s + num(e.usage_count), 0);
  const totalErr = clientKeys.reduce((s, e) => s + num(e.usage_errors), 0);
  const totalTok = clientKeys.reduce((s, e) => s + num(e.usage_input_tokens) + num(e.usage_output_tokens), 0);
  const query = q.trim().toLowerCase();
  const rows = clientKeys.filter(e => {
    const st = clientKeyStatus(e);
    if (filter !== 'all' && st.code !== filter && !(filter === 'active' && st.code === 'admin')) return false;
    if (!query) return true;
    return [e.name, e.key, st.text, ...(e.allowed_channels || []), ...(e.allowed_models || [])].join(' ').toLowerCase().includes(query);
  });

  const copyAll = () => {
    const keys = generated.map(e => e.key);
    if (!keys.length) { toast('还没有生成的调用 Key', 'err'); return; }
    copyText(keys.join('\n'), { label: ` ${keys.length} 个调用 Key` });
  };

  const scopeText = e => {
    if (e.key_type === 'admin') return html`<span class="faint">全部（管理 Key）</span>`;
    const chs = e.allowed_channels || [];
    const ms = e.allowed_models || [];
    if (!chs.length && !ms.length) return html`<span class="faint">不限渠道 / 模型</span>`;
    const chTitle = chs.map(k => channels[k]?.name || k).join('、');
    return html`<div class="badges">
      ${chs.length ? html`<${Badge} title=${chTitle}>渠道 ${chs.length}<//>` : null}
      ${ms.length ? html`<${Badge} title=${ms.join('\n')}>模型 ${ms.length}<//>` : null}
    </div>`;
  };

  return html`
    <${PageHeader} title="调用 Key" sub="客户端调用 /v1 时使用的 Bearer Token" actions=${html`
      <${Button} size="sm" icon="refresh" collapse onClick=${async () => { await loadConfig(); toast('已刷新'); }}>刷新<//>
      <${Button} size="sm" icon="copy" collapse onClick=${copyAll}>复制全部<//>
      <${Button} size="sm" variant="primary" icon="plus" collapse onClick=${() => openOverlay(ClientKeyGenerateDialog, {})}>生成 Key<//>`} />
    <div class="page-body">
      <div class="stats-row dense">
        <${Stat} icon="key" label="调用 Key" value=${fmtNum(generated.length)} sub=${`${counts.active || 0} 个有效${counts.disabled ? ` · ${counts.disabled} 停用` : ''}${counts.expired ? ` · ${counts.expired} 过期` : ''}`} />
        <${Stat} icon="send" label="累计请求" value=${fmtCompact(totalReq)} sub=${totalErr ? html`含管理 Key · <span class="danger-text">${fmtCompact(totalErr)} 失败</span>` : '含管理 Key'} />
        <${Stat} icon="database" label="累计 Token" value=${fmtCompact(totalTok)} sub="输入 + 输出" />
      </div>
      <div class="toolbar">
        <${SearchInput} value=${q} onChange=${setQ} placeholder="搜索名称 / Key / 渠道 / 模型" hotkey />
        <${Seg} value=${filter} onChange=${setFilter} options=${[
          { value: 'all', label: '全部', count: counts.all },
          { value: 'active', label: '有效', count: (counts.active || 0) + 1 },
          { value: 'disabled', label: '停用', count: counts.disabled || 0 },
          { value: 'expired', label: '过期', count: counts.expired || 0 },
          { value: 'exhausted', label: '额度用尽', count: counts.exhausted || 0 },
        ]} />
      </div>
      <div class="table-wrap">
        ${rows.length ? html`
          <table class="table stack cols-3">
            <thead><tr>
              <th>Key</th><th>状态</th><th>权限范围</th><th>额度</th><th>到期</th>
              <th class="num">请求 / 错误</th><th class="num">Token 入 / 出</th><th>最近使用</th><th class="actions-cell">操作</th>
            </tr></thead>
            <tbody>
              ${rows.map(e => {
                const st = clientKeyStatus(e);
                const isAdmin = e.key_type === 'admin';
                const limit = num(e.quota_limit);
                const used = num(e.quota_used);
                const expired = e.expires_at && Date.parse(e.expires_at) <= Date.now();
                return html`
                  <tr key=${e.key} class=${cx(!isAdmin && st.code !== 'active' && 'dim')}>
                    <td class="full">
                      <div class="cell-main ellipsis">${e.name || (isAdmin ? '主要 Key' : html`<span class="faint">未命名</span>`)}</div>

function ClientKeyGenerateDialog({ close }) {
  const [count, setCount] = useState(1);
  const [prefix, setPrefix] = useState('key');
  const [quota, setQuota] = useState(0);
  const [expires, setExpires] = useState('');
  const [chSel, setChSel] = useState(() => new Set());
  const [mdSel, setMdSel] = useState(() => new Set());
  const [created, setCreated] = useState(null);
  const adminKey = useStore(appStore, s => s.clientKeys.find(e => e.key_type === 'admin')?.key || '');
  const cleanPrefix = prefix.trim().replace(/[^a-zA-Z0-9_-]/g, '').slice(0, 24) || 'key';
  const scope = () => ({
    allowed_channels: [...chSel],
    allowed_models: [...mdSel],
    quota_limit: Math.max(0, Math.floor(Number(quota) || 0)),
    expires_at: datetimeLocalToIso(expires),
  });

  const generate = async () => {
    const n = clamp(Math.floor(Number(count)) || 1, 1, 100);
    const d = await api.post('/api/config/client-keys/generate', { count: n, prefix: cleanPrefix, ...scope() });
    if (Array.isArray(d.api_keys)) appStore.set({ clientKeys: d.api_keys });
    setCreated(d.keys || []);
    toast(`已生成 ${(d.keys || []).length || n} 个调用 Key，请立即保存`);
  };

  const addManual = async () => {
    const existing = new Set(appStore.get().clientKeys.map(e => e.key));
    const key = await promptDialog({
      title: '手动添加调用 Key',
      label: '调用 Key（使用下方同样的额度 / 有效期 / 范围设置）',
      placeholder: '例如 my-team-key-2026',
      okText: '添加',
      validate: v => {
        const t = v.trim();
        if (!t) return '调用 Key 不能为空';
        if (t === adminKey) return '不能与管理 Key 相同';
        if (existing.has(t)) return '该调用 Key 已存在';
        if (!isSafeHeaderValue(t)) return '只能包含可见的 ASCII 字符（不含空格）';
        return '';
      },
    });
    if (key == null) return;
    await saveClientKey({ key: key.trim(), name: '', quota_used: 0, enabled: true, ...scope() }, '已添加调用 Key');
    close();
  };

  if (created) {
    return html`
      <${Modal} size="md" title="生成完成" sub="完整 Key 之后也能在列表中点击复制" onClose=${() => close()} footer=${html`
        <${Button} icon="download" onClick=${() => downloadText(`client-keys-${cleanPrefix}-${Date.now()}.txt`, `${created.join('\n')}\n`)}>下载 .txt<//>
        <${Button} icon="copy" onClick=${() => copyText(created.join('\n'), { label: ` ${created.length} 个 Key` })}>复制全部<//>
        <${Button} variant="primary" onClick=${() => close()}>完成<//>`}>
        <div class="notice" style="margin-bottom:12px"><${Icon} name="checkCircle" /><div>已生成 <b>${created.length}</b> 个调用 Key。</div></div>
        <${CodeBlock} text=${created.join('\n')} maxHeight=${280} what=" Key 列表" />
      <//>`;
  }

  return html`
    <${Modal} size="lg" title="生成调用 Key" onClose=${() => close()} footer=${html`
      <span class="foot-left">示例：<span class="mono">${cleanPrefix}-${'x'.repeat(24)}</span></span>
      <${Button} onClick=${() => close()}>取消<//>
      <${Button} icon="edit" onClick=${addManual}>手动添加<//>
      <${Button} variant="primary" icon="zap" onClick=${generate}>生成 ${clamp(Math.floor(Number(count)) || 1, 1, 100)} 个<//>`}>
      <div class="form-grid">
        <${Field} label="数量（1-100）">
          <input class="input" type="number" min="1" max="100" value=${count} onInput=${e => setCount(e.currentTarget.value)} data-autofocus />
        <//>
        <${Field} label="Key 前缀" hint="仅保留字母、数字、_ 和 -；同时作为名称（多个时追加序号）。">
          <input class="input mono" value=${prefix} placeholder="key" onInput=${e => setPrefix(e.currentTarget.value)} />
        <//>
        <${Field} label="调用额度" hint="按请求次数计，0 = 不限。">
          <input class="input" type="number" min="0" value=${quota} onInput=${e => setQuota(e.currentTarget.value)} />
        <//>
        <${Field} label="过期时间" hint="留空 = 永久有效。">
          <input class="input" type="datetime-local" value=${expires} onInput=${e => setExpires(e.currentTarget.value)} />
        <//>
        <${ScopeFields} channelsSel=${chSel} setChannelsSel=${setChSel} modelsSel=${mdSel} setModelsSel=${setMdSel} />
      </div>
    <//>`;
}

function ClientKeyEditDialog({ entry, close }) {
  const [name, setName] = useState(entry.name || '');
  const [enabled, setEnabled] = useState(entry.enabled !== false);
  const [quota, setQuota] = useState(num(entry.quota_limit));
  const [expires, setExpires] = useState(toDatetimeLocalValue(entry.expires_at));
  const [resetUsed, setResetUsed] = useState(false);
  const [chSel, setChSel] = useState(() => new Set(entry.allowed_channels || []));
  const [mdSel, setMdSel] = useState(() => new Set(entry.allowed_models || []));
  const used = num(entry.quota_used);

  const save = async () => {
    await saveClientKey({
      key: entry.key,
      name: name.trim(),
      allowed_channels: [...chSel],
      allowed_models: [...mdSel],
      quota_limit: Math.max(0, Math.floor(Number(quota) || 0)),
      quota_used: resetUsed ? 0 : used,
      expires_at: datetimeLocalToIso(expires),
      enabled,
    }, '调用 Key 已更新');
    close(true);
  };

  return html`
    <${Modal} size="lg" title="编辑调用 Key" sub=${html`<span class="mono">${maskKey(entry.key)}</span>`} onClose=${() => close()} footer=${html`
      <${Button} onClick=${() => close()}>取消<//>
      <${Button} variant="primary" icon="check" onClick=${save}>保存<//>`}>
      <div class="form-grid">
        <${Field} label="名称">
          <input class="input" value=${name} placeholder="备注名" onInput=${e => setName(e.currentTarget.value)} data-autofocus />
        <//>
        <${Field} label="状态">
          <div style="padding-top:6px"><${Switch} checked=${enabled} onChange=${setEnabled} label="启用该 Key" /></div>
        <//>
        <${Field} label="调用额度" hint=${`已用 ${fmtNum(used)} 次，0 = 不限。`}>
          <input class="input" type="number" min="0" value=${quota} onInput=${e => setQuota(e.currentTarget.value)} />
        <//>
        <${Field} label="过期时间" hint="留空 = 永久有效。">
          <div class="row">
            <input class="input" type="datetime-local" value=${expires} onInput=${e => setExpires(e.currentTarget.value)} />
            ${expires ? html`<${Button} size="sm" variant="ghost" icon="x" iconOnly title="清除过期时间" onClick=${() => setExpires('')} />` : null}
          </div>
        <//>
        <div class="span-2">
          <${Checkbox} checked=${resetUsed} onChange=${setResetUsed} label=${`保存时将已用额度（${fmtNum(used)}）重置为 0`} />
        </div>
        <${ScopeFields} channelsSel=${chSel} setChannelsSel=${setChSel} modelsSel=${mdSel} setModelsSel=${setMdSel} />
      </div>
    <//>`;
}

/* ==========================================================================
   16 · page: 日志
   ========================================================================== */
const AUTO_REFRESH_OPTIONS = [0, 5, 15, 30, 60];

function logRowId(e) {
  return `${e.timestamp || ''}|${e.event || ''}|${e.requestId || ''}`;
}

function LogsPage() {
  const [event, setEvent] = useSessionState('logs.event', 'request_complete');
  const [q, setQ] = useSessionState('logs.q', '');
  const [ip, setIp] = useSessionState('logs.ip', '');
  const [page, setPage] = useSessionState('logs.page', 1);
  const [pageSize, setPageSize] = usePref('logs.pageSize', 50);
  const [auto, setAuto] = usePref('logs.autoRefresh', 0);
  const [data, setData] = useState({ logs: [], total: 0, totalPages: 1, events: [], file: '', loaded: false, loading: true, error: '', at: 0 });
  const [fresh, setFresh] = useState(() => new Set());
  const seq = useRef(0);
  const known = useRef(new Set());

  const load = async (p, { quiet = false } = {}) => {
    const my = ++seq.current;
    if (!quiet) setData(d => ({ ...d, loading: true }));
    const params = new URLSearchParams({ limit: 'all', page: String(p), pageSize: String(pageSize) });
    if (event) params.set('event', event);
    if (q.trim()) params.set('search', q.trim());
    if (ip.trim()) params.set('ip', ip.trim());
    try {
      const d = await api.get(`/api/logs?${params}`);
      if (my !== seq.current) return;
      const logs = Array.isArray(d.logs) ? d.logs : [];
      if (quiet) {
        const added = new Set(logs.map(logRowId).filter(id => !known.current.has(id)));
        setFresh(added);
      } else {
        setFresh(new Set());
      }
      known.current = new Set(logs.map(logRowId));
      const totalPages = Math.max(1, num(d.totalPages) || 1);
      setData({ logs, total: num(d.total), totalPages, events: Array.isArray(d.events) ? d.events : [], file: d.file || '', loaded: true, loading: false, error: '', at: Date.now() });
      if (p > totalPages && num(d.total) > 0) setPage(totalPages);
    } catch (err) {
      if (my !== seq.current) return;
      setData(d => ({ ...d, loading: false, loaded: true, error: err.message }));
      if (!quiet) reportError(err, '日志加载失败：');
    }
  };

  useEffect(() => { load(page); }, [event, q, ip, pageSize, page]);
  useInterval(() => {
    if (document.visibilityState === 'hidden' || hasOverlay() || page !== 1) return;
    load(1, { quiet: true });
  }, auto ? auto * 1000 : 0);

  const withReset = setter => v => { setter(v); setPage(1); };
  const eventOptions = uniq([...(event ? [event] : []), ...data.events]);

  const clearLogs = async () => {
    const ok = await confirmDialog({
      title: '清空日志',
      message: '清空全部请求日志？',
      detail: '服务端会先把现有日志文件打包备份到 backups 目录，再清空日志文件与索引。统计数据不受影响。',
      okText: '清空全部',
      danger: true,
    });
    if (!ok) return;
    await api.post('/api/logs/clear');
    toast('日志已清空');
    setPage(1);
    await load(1);
  };

  const openDetail = index => openOverlay(LogDetail, { list: data.logs, index }, { kind: 'drawer' });

  return html`
    <${PageHeader} title="日志" sub=${data.file ? `当前文件 ${data.file.split(/[\\/]/).pop()}` : ''} actions=${html`
      <div class="row" style="gap:6px" title=${page !== 1 && auto ? '自动刷新仅在第 1 页生效' : '定时刷新第 1 页'}>
        ${auto && page === 1 ? html`<span class="live-dot"></span>` : null}
        <select class="select sm auto" value=${String(auto)} onChange=${e => setAuto(Number(e.currentTarget.value))}>
          ${AUTO_REFRESH_OPTIONS.map(s => html`<option value=${String(s)}>${s ? `每 ${s} 秒刷新` : '自动刷新：关'}</option>`)}
        </select>
      </div>
      <${Button} size="sm" icon="refresh" collapse loading=${data.loading && data.loaded} onClick=${async () => { await load(page); toast('已刷新'); }}>刷新<//>
      <${Button} size="sm" variant="danger" icon="trash" collapse onClick=${clearLogs}>清空日志<//>`} />
    <div class="page-body">
      <div class="toolbar">
        <select class="select auto" value=${event} onChange=${e => withReset(setEvent)(e.currentTarget.value)} title="事件类型">
          <option value="">全部事件</option>
          ${eventOptions.map(ev => html`<option value=${ev}>${logEventLabel(ev)}${LOG_EVENT_LABELS[ev] ? ` · ${ev}` : ''}</option>`)}
        </select>
        <${SearchInput} value=${q} onChange=${withReset(setQ)} delay=${350} placeholder="关键词：模型 / 错误 / requestId / Key 指纹" hotkey />
        <${SearchInput} value=${ip} onChange=${withReset(setIp)} delay=${350} placeholder="IP 过滤" icon="globe" class="ip-filter" />
        <span class="tb-meta">${data.loading && !data.loaded ? '加载中…' : `${event === 'request_complete' ? '请求' : '事件'} ${fmtNum(data.total)} 条`}</span>
      </div>
      ${data.error && data.loaded && !data.logs.length ? html`
        <div class="notice danger"><${Icon} name="alert" /><div>日志加载失败：${data.error}</div></div>` : null}
      <div class="table-wrap">
        ${!data.loaded ? html`<div style="padding:16px"><${SkeletonRows} rows=${8} h=${38} /></div>`
          : !data.logs.length ? html`<${Empty} icon="list" title="没有匹配的日志" desc=${q || ip || event ? '调整筛选条件后再试。' : '有请求经过网关后会显示在这里。'} />`
          : html`
          <table class="table stack log-table">
            <thead><tr>
              <th>时间</th><th>模型 / 请求</th><th>渠道</th><th class="num">Token 入 / 出</th><th class="num">耗时</th><th>状态</th><th>摘要</th>
            </tr></thead>
            <tbody>
              ${data.logs.map((e, i) => {
                const cls = logClass(e);
                const inTok = logInputTokens(e);
                const outTok = logOutputTokens(e) || (!inTok ? num(e.totalTokens ?? e.tokens) : 0);
                const model = logModel(e);
                const addr = logIp(e);
                const summary = logSummary(e);
                return html`
                  <tr key=${`${logRowId(e)}#${i}`} class=${cx('clickable', cls === 'err' && 'row-err', cls === 'warn' && 'row-warn', fresh.has(logRowId(e)) && 'fresh')}
                    onClick=${() => openDetail(i)} title="点击查看详情">
                    <td class="c-time nowrap small tnum" data-label="时间" title=${fmtTime(e.timestamp)}>${fmtTime(e.timestamp, { year: false })}</td>
                    <td class="c-model full" style="max-width:320px">
                      <div class=${cx('ellipsis mono', !model && 'faint')} style="font-weight:600;font-size:12.5px" title=${model || e.url || ''}>
                        ${model || (e.url ? `${e.method || ''} ${e.url}`.trim() : logEventLabel(e.event))}
                      </div>
                      <div class="cell-sub row" style="gap:6px">
                        <span class="mono">${e.requestId || logEventLabel(e.event)}</span>
                        ${addr ? html`<button type="button" class="link-btn mono" style="font-weight:500" title="按此 IP 过滤"
                          onClick=${ev => { ev.stopPropagation(); withReset(setIp)(addr); }}>${addr}</button>` : null}
                        ${e.stream ? html`<${Badge} sq>流式<//>` : null}
                        ${!event && e.event !== 'request_complete' ? html`<${Badge} sq>${logEventLabel(e.event)}<//>` : null}
                      </div>
                    </td>
                    <td data-label="渠道" class="c-channel ellipsis" style="max-width:150px" title=${logChannel(e)}>${channelDisplayName(logChannel(e)) || '—'}</td>
                    <td class="c-tokens num" data-label="Token 入 / 出">${inTok ? fmtCompact(inTok) : '—'} <span class="faint">/</span> ${outTok ? fmtCompact(outTok) : '—'}</td>
                    <td class="c-dur num" data-label="耗时">${e.durationMs != null ? fmtDuration(e.durationMs) : '—'}</td>
                    <td class="c-status" data-label="状态"><${Badge} tone=${cls === 'err' ? 'danger' : cls === 'warn' ? 'warn' : 'success'}>${logStatusLabel(e)}<//></td>
                    <td class="c-sum full" data-label="摘要"><div class="ellipsis small faint" style="max-width:340px" title=${summary}>${summary || '—'}</div></td>
                  </tr>`;
              })}
            </tbody>
          </table>`}
      </div>
      ${data.loaded && data.total > 0 ? html`
        <${Pager} page=${page} totalPages=${data.totalPages} total=${data.total} onPage=${setPage}
          pageSize=${pageSize} pageSizes=${[20, 50, 100, 200]} onPageSize=${withReset(setPageSize)} />` : null}
    </div>`;
}

const LOG_DETAIL_PREFERRED = ['timestamp', 'event', 'requestId', 'model', 'requestedModel', 'upstreamModel', 'upstreamPayloadModel', 'channel', 'channelKey', 'statusCode', 'durationMs', 'inputTokens', 'outputTokens', 'totalTokens', 'tokens', 'cacheReadInputTokens', 'cacheCreationInputTokens', 'clientIp', 'ip', 'stream', 'messageCount', 'clientKeyType', 'clientKeyFingerprint', 'upstreamKeyIndex', 'upstreamKeyCount', 'upstreamKeyFingerprint', 'upstreamHost', 'upstreamPath', 'requestBytes', 'reason', 'autoTruncated'];
const LOG_BIG_FIELDS = new Set(['inputContent', 'outputContent', 'responseBody', 'errorMessage', 'error', 'headers', 'params', 'finalParams', 'removedParams', 'modelParams', 'raw', 'body']);

function stageDetail(stage) {
  switch (stage.event) {
    case 'chat_request': return `${num(stage.messageCount)} 条消息${stage.stream ? ' · 流式' : ''}${Array.isArray(stage.params) && stage.params.length ? ` · 参数 ${stage.params.join(', ')}` : ''}`;
    case 'upstream_request': return `${stage.method || 'POST'} ${stage.upstreamHost || ''}${stage.upstreamPath || ''}${stage.upstreamKeyCount ? ` · Key #${num(stage.upstreamKeyIndex) + 1}/${stage.upstreamKeyCount}` : ''}${stage.requestBytes ? ` · ${fmtCompact(stage.requestBytes)} 字节` : ''}`;
    case 'request_complete': return `${logStatusLabel(stage)} · ${fmtDuration(stage.durationMs)} · ${fmtCompact(logInputTokens(stage))} → ${fmtCompact(logOutputTokens(stage))} tokens`;
    default: return logSummary(stage);
  }
}

function LogDetail({ list, index: startIndex, requestClose }) {
  const [index, setIndex] = useState(startIndex);
  const entry = list[index] || {};
  const [chain, setChain] = useState({ loading: false, items: null });

  useEffect(() => {
    if (!entry.requestId) { setChain({ loading: false, items: null }); return undefined; }
    let alive = true;
    setChain({ loading: true, items: null });
    const params = new URLSearchParams({ limit: '200', page: '1', pageSize: '200', search: entry.requestId });
    api.get(`/api/logs?${params}`)
      .then(d => {
        if (!alive) return;
        const items = (d.logs || []).filter(x => x.requestId === entry.requestId)
          .sort((a, b) => String(a.timestamp || '').localeCompare(String(b.timestamp || '')));
        setChain({ loading: false, items });
      })
      .catch(() => { if (alive) setChain({ loading: false, items: null }); });
    return () => { alive = false; };
  }, [index]);

  useEffect(() => {
    const onKey = e => {
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '')) return;
      if (overlayStore.get().stack.at(-1)?.Component !== LogDetail) return;
      if (e.key === 'ArrowDown' || e.key === 'j') { e.preventDefault(); setIndex(i => Math.min(list.length - 1, i + 1)); }
      if (e.key === 'ArrowUp' || e.key === 'k') { e.preventDefault(); setIndex(i => Math.max(0, i - 1)); }
    };
    addEventListener('keydown', onKey);
    return () => removeEventListener('keydown', onKey);
  }, [list.length]);

  const cls = logClass(entry);
  const raw = JSON.stringify(entry, null, 2);
  const seen = new Set();
  const items = [];
  const push = (k, v) => {
    if (v == null || v === '' || typeof v === 'object' || LOG_BIG_FIELDS.has(k)) return;
    items.push([k, v]);
  };
  for (const k of LOG_DETAIL_PREFERRED) if (hasOwn(entry, k)) { seen.add(k); push(k, entry[k]); }
  for (const [k, v] of Object.entries(entry)) if (!seen.has(k)) push(k, v);
  const t0 = chain.items?.length ? toMs(chain.items[0].timestamp) : 0;
  const blocks = [
    ['errorMessage', '错误信息', 'alert', true],
    ['error', '错误', 'alert', true],
    ['responseBody', '上游响应体', 'file', true],
    ['outputContent', '输出内容', 'send', false],
    ['inputContent', '输入内容', 'inbox', false],
    ['headers', '请求头', 'list', false],
  ].filter(([k]) => entry[k] != null && entry[k] !== '');

  return html`
    <${Drawer} wide onClose=${requestClose}
      title=${html`<span class="mono">${entry.requestId || logEventLabel(entry.event)}</span>`}
      headExtra=${html`
        <span class="small faint tnum nowrap">${index + 1} / ${list.length}</span>
        <${Button} size="sm" variant="ghost" icon="chevU" iconOnly title="上一条 (↑ / k)" disabled=${index <= 0} onClick=${() => setIndex(index - 1)} />
        <${Button} size="sm" variant="ghost" icon="chevD" iconOnly title="下一条 (↓ / j)" disabled=${index >= list.length - 1} onClick=${() => setIndex(index + 1)} />`}
      footer=${html`
        <span class="foot-left">${fmtTime(entry.timestamp)}</span>
        <${CopyButton} text=${raw} label="复制 JSON" size="" variant="" what=" JSON" />
        <${Button} onClick=${requestClose}>关闭<//>`}>
      <div class="col" style="gap:16px">
        <div class="row wrap" style="gap:8px">
          <${Badge} tone=${cls === 'err' ? 'danger' : cls === 'warn' ? 'warn' : 'success'}>${logStatusLabel(entry)}<//>
          <${Badge} sq>${logEventLabel(entry.event)}<//>
          ${logModel(entry) ? html`<span class="mono" style="font-weight:600">${logModel(entry)}</span>` : null}
          ${logChannel(entry) ? html`<span class="faint">· ${channelDisplayName(logChannel(entry))}</span>` : null}
        </div>
        <div class="stats-row">
          <${Stat} inset label="耗时" value=${entry.durationMs != null ? fmtDuration(entry.durationMs) : '—'} />
          <${Stat} inset label="输入 Token" value=${fmtNum(logInputTokens(entry))} sub=${num(entry.cacheReadInputTokens) || num(entry.cacheCreationInputTokens) ? `缓存读 ${fmtCompact(entry.cacheReadInputTokens)} · 写 ${fmtCompact(entry.cacheCreationInputTokens)}` : ''} />
          <${Stat} inset label="输出 Token" value=${fmtNum(logOutputTokens(entry))} />
          <${Stat} inset label="客户端" value=${html`<span style="font-size:15px">${logIp(entry) || '—'}</span>`} sub=${entry.clientKeyType ? `${entry.clientKeyType === 'admin' ? '管理 Key' : '调用 Key'} ${entry.clientKeyFingerprint || ''}` : ''} />
        </div>

        ${entry.requestId ? html`
          <div class="col" style="gap:10px">
            <div class="section-title"><${Icon} name="activity" />请求链路${chain.loading ? html` <${Spinner} size="sm" />` : null}</div>
            ${chain.items?.length ? html`
              <div class="timeline">
                ${chain.items.map((st, i) => {
                  const c = logClass(st);
                  const offset = t0 ? toMs(st.timestamp) - t0 : 0;
                  const current = st.event === entry.event && st.timestamp === entry.timestamp;
                  return html`
                    <div key=${i} class=${cx('tl-item', c, current && 'current')}>
                      <span class="tl-dot"></span>
                      <div class="tl-body">
                        <div class="tl-title">${logEventLabel(st.event)}
                          <span class="xs faint tnum" style="font-weight:400">${fmtTime(st.timestamp, { date: false })}${i ? ` · +${fmtDuration(offset)}` : ''}</span>
                        </div>
                        <div class="tl-detail">${stageDetail(st) || '—'}</div>
                      </div>
                    </div>`;
                })}
              </div>` : !chain.loading ? html`<div class="small faint">没有找到同一请求的其它事件。</div>` : null}
          </div>` : null}

        ${blocks.length ? html`
          <div>
            ${blocks.map(([k, label, icon, open]) => {
              const text = prettyJson(entry[k]);
              return html`
                <${Collapse} key=${`${index}-${k}`} title=${label} icon=${icon} defaultOpen=${open} meta=${`${fmtNum(String(text).length)} 字符`}>
                  <${CodeBlock} text=${text} maxHeight=${320} what=${label} />
                <//>`;
            })}
          </div>` : null}

        <div class="col" style="gap:10px">
          <div class="section-title"><${Icon} name="list" />全部字段</div>
          <div class="detail-grid">
            ${items.map(([k, v]) => html`<div class="detail-item" key=${k}><span>${k}</span><b>${k === 'timestamp' ? fmtTime(v) : String(v)}</b></div>`)}
          </div>
        </div>
        <${Collapse} key=${`raw-${index}`} title="原始 JSON" icon="code" meta=${`${fmtNum(raw.length)} 字符`}>
          <${CodeBlock} text=${raw} maxHeight=${420} what=" JSON" />
        <//>
      </div>
    <//>`;
}

function randomKey(len = 40) {
  const alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';
  const bytes = crypto.getRandomValues(new Uint8Array(len));
  return `gw-${[...bytes].map(b => alphabet[b % alphabet.length]).join('')}`;
}

async function importBackupFile(file) {
  let data;
  try {
    data = JSON.parse(await file.text());
  } catch {
    toast('备份文件不是有效的 JSON', 'err');
    return;
  }
  const isV2 = data && isObj(data.config);
  const cfg = isV2 ? data.config : data;
  if (!isObj(cfg) || !isObj(cfg.channels)) {
    toast('备份文件缺少 channels，无法导入', 'err');
    return;
  }
  const channelCount = Object.keys(cfg.channels).length;
  const modelCount = Object.values(cfg.channels).reduce((s, ch) => s + (Array.isArray(ch?.models) ? ch.models.length : 0), 0);
  const keyCount = Object.values(cfg.channels).reduce((s, ch) => s + channelKeysOf(ch || {}).length, 0);
  const clientCount = Array.isArray(cfg.api_keys) ? cfg.api_keys.length : 0;
  const hasStats = isV2 && isObj(data.stats);
  const ok = await confirmDialog({
    title: '导入备份',
    message: `文件：${file.name}${data.exported_at ? `\n导出时间：${fmtTime(data.exported_at)}` : ''}\n内容：${channelCount} 个渠道 · ${modelCount} 个模型 · ${keyCount} 个上游 Key · ${clientCount} 个调用 Key${hasStats ? ' · 统计数据' : ''}`,
    detail: `导入会覆盖当前全部配置${hasStats ? '与统计数据' : ''}，无法撤销。建议先导出一份当前备份。`,
    okText: '覆盖导入',
    danger: true,
  });
  if (!ok) return;
  const d = await api.post('/api/config/import', data);
  toast(`备份已导入：${d.channels ?? channelCount} 个渠道 · ${d.models ?? modelCount} 个模型${d.statsRestored ? ' · 已恢复统计' : ''}`);
  await refreshAll();
}

/* Presentation-only native gateway results; never manufacture calibrated confidence. */
function DetectorResults({ result }) {
  const [expanded, setExpanded] = useState(false);
  useEffect(() => setExpanded(false), [result]);
  const candidates = result.candidates || [];
  const unscorable = ['not_model', 'unscorable'].includes(result.decision) || !candidates.length;
  const top = !unscorable ? candidates[0] : null;
  const confidence = c => result.calibrated && Number.isFinite(c?.probability) && c.probability >= 0 && c.probability <= 1 ? c.probability : null;
  const percent = v => v === null ? '不可用' : (v * 100).toFixed(1) + '%';
  const topConfidence = confidence(top);
  const rows = expanded ? candidates : candidates.slice(0, 8);
  const label = unscorable ? (result.decision === 'not_model' ? '样本特征异常' : '暂不可评分')
    : result.used < 3 ? '部分样本排名' : result.calibrated ? '库内校准排名' : '未校准排名';
  return html`
    <div class="detector-results">
      <div class="detector-summary">
        <div class="detector-lead">
          <div class="row wrap" style="gap:8px"><span class="small muted">${unscorable ? '本次分析' : '最接近的候选'}</span><${Badge} tone=${unscorable || !result.calibrated ? 'warn' : 'accent'}>${label}<//></div>
          <div class="detector-model">${top?.model || label}</div>
          <div class="small muted">${top?.family || '未生成候选排名'}</div>
        </div>
        <div class="detector-metric">
          <div class="detector-confidence mono">${unscorable ? '—' : percent(topConfidence)}</div>
          <div class="small muted">库内相对置信度</div>
          <div class="small muted">有效样本 <strong>${result.used}/3</strong></div>
        </div>
      </div>
      <div class=${'notice ' + (unscorable || !result.calibrated ? 'warn' : '')}>
        <${Icon} name="info" /><div>${result.evidence?.reason || '结果仅反映与参考指纹库的相对匹配情况。'}<br />不是模型身份的确定证明，也不包含库外模型。</div>
      </div>
      ${!unscorable ? html`
        <div class="row wrap" style="justify-content:space-between"><strong>候选排名</strong><span class="small muted">${candidates.length} 个候选 · ${result.calibrated ? '条形表示库内相对置信度' : '置信度不可用，保留原始排名分值'}</span></div>
        <ol class="detector-ranking" aria-label="模型候选排名">
          ${rows.map((c, i) => { const p = confidence(c); return html`
            <li key=${c.id} class=${'detector-rank ' + (i === 0 ? 'first' : '')}>
              <span class="detector-position mono">${String(i + 1).padStart(2, '0')}</span>
              <div class="detector-candidate"><div class="detector-candidate-name">${c.model}</div><span class="small muted">${c.family || '—'}</span></div>
              <div class="detector-bar" aria-hidden="true">${p !== null ? html`<${Progress} value=${p * 100} />` : html`<span class="small muted">置信度不可用</span>`}</div>
              <div class="detector-rank-value"><strong class="mono">${p !== null ? percent(p) : '—'}</strong><div class="small muted">分值 ${Number.isFinite(c.score) ? c.score.toFixed(4) : '—'}</div></div>
            </li>`; })}
        </ol>
        ${candidates.length > 8 ? html`<div><${Button} size="sm" aria-expanded=${expanded} onClick=${() => setExpanded(v => !v)}>${expanded ? '收起排名' : `展开全部 ${candidates.length} 个候选`}<//></div>` : null}
      ` : null}
      <details class="detector-limits small muted"><summary>结果如何解读</summary><p>置信度仅在引擎返回有效校准结果时展示，不把排名分值换算为概率。部分样本或未校准结果只提供候选顺序；分值可能为负数，不代表准确率。</p><p>未收录的模型、采样参数、上游路由变化都可能影响结果。算法与参考指纹来自 lm-detector 开源项目。</p></details>
    </div>`;
}

/* Native gateway page: no iframe, standalone application, or external UI. */
function DetectorPage() {
  const [models, setModels] = useState([]);
  const [savedModel, setSavedModel] = usePref('detector.model', '');
  const [loading, setLoading] = useState(true);
  const [catalogError, setCatalogError] = useState('');
  const [update, setUpdate] = useState(null);
  const [updateError, setUpdateError] = useState('');
  const [syncing, setSyncing] = useState(false);
  const [run, setRun] = useState({ phase: 'idle', message: '选择模型后开始检测', samples: [] });
  const [result, setResult] = useState(null);
  const engine = useRef(null);
  const controller = useRef(null);
  const generation = useRef(0);
  const alive = useRef(true);
  const busyRef = useRef(false);
  const model = models.includes(savedModel) ? savedModel : (models[0] || '');
  const busy = ['loading', 'sampling', 'scoring'].includes(run.phase);
  const request = async (path, options = {}) => {
    const response = await fetch('/api/lm-detector/' + path, { credentials: 'same-origin', cache: 'no-store', redirect: 'error', ...options });
    if (!response.ok) throw new Error(response.status === 401 || response.status === 403 ? '登录已失效，请重新登录网关。' : '请求失败，请稍后重试。');
    return response.json();
  };
  const loadModels = async () => {
    setLoading(true); setCatalogError('');
    try {
      const data = await request('v1/models');
      if (!Array.isArray(data.data)) throw new Error('模型列表格式异常');
      const ids = [...new Set(data.data.map(x => x.id).filter(x => typeof x === 'string' && x))].sort();
      if (alive.current) setModels(ids);
    } catch (e) { if (alive.current) { setModels([]); setCatalogError('无法读取模型列表，请检查登录状态后刷新。'); } }
    finally { if (alive.current) setLoading(false); }
  };
  const loadUpdate = async () => {
    try { const data = await request('updates'); if (alive.current) { setUpdate(data); setUpdateError(''); } }
    catch { if (alive.current) setUpdateError('暂时无法读取同步状态'); }
  };
  useEffect(() => {
    alive.current = true;
    loadModels(); loadUpdate();
    return () => { alive.current = false; generation.current++; controller.current?.abort(); engine.current?.dispose(); engine.current = null; };
  }, []);
  useInterval(loadUpdate, update?.running || syncing ? 2000 : 30000);
  const reset = () => {
    generation.current++; controller.current?.abort(); engine.current?.dispose(); engine.current = null; busyRef.current = false;
    setResult(null); setRun({ phase: 'idle', message: '选择模型后开始检测', samples: [] });
  };
  const stop = () => {
    generation.current++; controller.current?.abort(); engine.current?.dispose(); engine.current = null; busyRef.current = false;
    setRun(s => ({ ...s, phase: 'cancelled', message: '检测已停止，已发出的请求可能仍会计费。' }));
  };
  const start = async () => {
    if (!model || busyRef.current) return;
    busyRef.current = true;
    const token = ++generation.current;
    const current = () => alive.current && generation.current === token;
    setResult(null); setRun({ phase: 'loading', message: '正在准备检测引擎和指纹库…', samples: [] });
    try {
      const module = await import('/lm-detector/native/engine.js');
      if (!current()) return;
      const abort = new AbortController();
      controller.current = abort;
      const detector = await module.createDetector({ signal: abort.signal, onProgress: progress => {
        if (!current()) return;
        const samples = progress.progress?.challenges || progress.samples;
        const messages = { loading: '正在加载指纹库…', ready: '指纹库已就绪', sampling: progress.progress?.message || '正在采样…', scoring: '正在分析指纹…' };
        if (messages[progress.phase] || samples) setRun(s => ({
          ...s, phase: progress.phase === 'ready' ? 'loading' : progress.phase === 'complete' ? 'scoring' : progress.phase,
          message: messages[progress.phase] || s.message,
          samples: samples ? samples.map(x => ({ status: x.status, characters: x.text?.length || 0 })) : s.samples
        }));
      } });
      if (!current()) { detector.dispose(); return; }
      engine.current = detector;
      const report = await detector.run({ model, parallel: true, signal: abort.signal });
      if (current()) {
        const analysis = report.analysis;
        setResult({
          used: analysis.used_outputs, decision: analysis.decision,
          evidence: analysis.evidence, calibrated: analysis.probability_status === 'reference_calibrated',
          candidates: analysis.results.map(c => ({ id: c.model, model: c.display_name || c.model,
            family: c.family_name, probability: c.probability, score: c.score }))
        });
        setRun(s => ({ ...s, phase: 'done', message: '检测完成' }));
      }
    } catch (e) {
      if (current()) setRun(s => ({ ...s, phase: 'error', message: '检测未完成，请检查样本状态、网关日志或指纹同步状态后重试。' }));
    } finally {
      if (current()) { engine.current?.dispose(); engine.current = null; busyRef.current = false; }
    }
  };
  const sync = async () => {
    if (syncing || update?.running) return;
    setSyncing(true); setUpdateError('');
    try { const data = await request('updates', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' }); if (alive.current) setUpdate(data); }
    catch { if (alive.current) setUpdateError('同步请求失败，请检查登录状态后重试。'); }
    finally { if (alive.current) setSyncing(false); }
  };
  const samples = run.samples || [];
  const phaseLabel = { idle: '待检测', loading: '准备中', sampling: '采样中', scoring: '分析中', done: '已完成', cancelled: '已停止', error: '未完成' }[run.phase] || '处理中';
  return html`
    <${PageHeader} title="模型检测" sub="网关工具" badges=${html`<${Badge} tone=${busy ? 'info' : run.phase === 'done' ? 'success' : ''}>${phaseLabel}<//>`} />
    <div class="page-body">
      <div class="grid main-side">
        <${Card} title="检测任务" icon="search" sub="直接使用网关模型">
          <div class="col" style="gap:14px">
            <${Field} label="待检测模型" htmlFor="detector-model" hint="自动读取网关配置，不需要填写模型 ID、接口地址或密钥。">
              <div class="row" style="min-width:0">
                <select id="detector-model" class="select" style="min-width:0;flex:1" value=${model} disabled=${busy || loading || !models.length}
                  onChange=${e => { reset(); setSavedModel(e.currentTarget.value); }}>
                  ${!models.length ? html`<option value="">${loading ? '正在读取模型…' : '暂无可用模型'}</option>` : models.map(id => html`<option key=${id} value=${id}>${id}</option>`)}
                </select>
                <${Button} icon="refresh" iconOnly title="刷新模型列表" disabled=${busy || loading} onClick=${() => { reset(); return loadModels(); }} />
              </div>
            <//>
            ${catalogError ? html`<div class="danger-text small" role="alert">${catalogError}</div>` : null}
            ${!loading && !catalogError && !models.length ? html`<div class="notice warn">网关没有可用模型，请先在渠道中配置模型。</div>` : null}
            <div class="notice"><${Icon} name="info" /><div>点击开始后并发发送 3 次采样请求，使用现有网关路由并计入用量。结果反映与指纹库的相似程度，不是模型身份的确定证明。</div></div>
            <div class="row wrap">
              <${Button} variant="primary" icon="search" disabled=${busy || loading || !model} onClick=${start}>${result || run.phase === 'error' || run.phase === 'cancelled' ? '重新检测' : '开始检测'}<//>
              ${busy ? html`<${Button} icon="stop" variant="danger" onClick=${stop}>停止<//>` : null}
              <span class="small muted" role="status" style="overflow-wrap:anywhere">${run.message}</span>
            </div>
          </div>
        <//>
        <${Card} title="指纹库同步" icon="database" actions=${html`<${Badge} tone=${updateError || update?.lastError ? 'warn' : update?.running ? 'info' : update?.automatic ? 'success' : ''}>${updateError ? '状态未知' : update?.running ? '同步中' : update?.automatic ? '自动更新' : update ? '未启用' : '读取中'}<//>`}>
          <div class="col small" style="gap:10px;overflow-wrap:anywhere">
            <div class="muted">每天检查 lm-detector 项目发布的指纹数据；校验通过后切换，失败保留当前版本。</div>
            <div>当前版本：<span class="mono" title=${update?.version || ''}>${update?.version ? update.version.slice(0, 12) : '读取中…'}</span></div>
            <div>最近检查：${update?.lastChecked ? fmtTime(update.lastChecked) : '尚未检查'}</div>
            <div>最近同步成功：${update?.lastSuccess ? fmtTime(update.lastSuccess) : '随部署安装'}</div>
            <div>下次检查：${update?.nextCheck ? fmtTime(update.nextCheck) : '等待调度'}</div>
            ${updateError || update?.lastError ? html`<div class="warn-text" role="alert">${updateError || update.lastError?.message}</div>` : null}
            <div><${Button} size="sm" icon="refresh" disabled=${syncing || update?.running} onClick=${sync}>${syncing || update?.running ? '正在同步…' : '立即同步'}<//></div>
            <div class="field-hint">只同步已发布的指纹库，不调用模型、不自动拉取或执行上游代码。</div>
          </div>
        <//>
      </div>
      <${Card} title="采样进度" icon="activity" sub="三个挑战并发采样 · 切换模型清空本次结果" flush>
        <div class="table-wrap"><table class="table"><thead><tr><th>挑战</th><th>状态</th><th class="num">已接收字符</th></tr></thead><tbody>
          ${[0, 1, 2].map(i => { const sample = samples[i]; return html`<tr key=${i}><td>样本 ${i + 1}</td><td style="overflow-wrap:anywhere">${sample?.status || '等待采样'}</td><td class="num">${fmtNum(sample?.characters || 0)}</td></tr>`; })}
        </tbody></table></div>
      <//>
      <${Card} title="指纹分析" icon="chart" sub=${result ? '按指纹匹配结果排序' : '采样结束后在本地分析'}>
        ${result ? html`<${DetectorResults} result=${result} />`
          : html`<${Empty} icon="search" title=${busy ? '检测进行中' : '暂无检测结果'} desc="选择网关模型并开始检测，结果会直接显示在这里。" compact />`}
      <//>
    </div>`;
}

          <${Button} variant="primary" icon="refresh" onClick=${onRetry}>重试<//>`
        : html`
          <h2>聚合渠道</h2>
          <p>正在加载配置…</p>
          <${Spinner} size="lg" />`}
      </div>
    </div>`;
}

function pageTitle(route, channels) {
  if (route.route === 'channels' && route.arg) return `${channels[route.arg]?.name || route.arg} · 渠道`;
  return ROUTES[route.route]?.title || '控制台';
}

function App() {
  const route = useRoute();
  const configLoaded = useStore(appStore, s => s.configLoaded);
  const channels = useStore(appStore, s => s.channels);
  const navOpen = useStore(navStore, s => s.open);
  const [bootError, setBootError] = useState('');

  const boot = async () => {
    setBootError('');
    try {
      await loadConfig();
    } catch (err) {
      if (err.status !== 401) setBootError(err.message || String(err));
      return;
    }
    loadStats().catch(noop);
  };

  useEffect(() => { boot(); }, []);
  useEffect(() => { closeNav(); }, [route.route, route.arg]);
  useEffect(() => { document.title = `${pageTitle(route, channels)} · 聚合渠道控制台`; }, [route.route, route.arg, channels]);

  useEffect(() => {
    // 「/」聚焦当前页面的搜索框
    const onKey = e => {
      if (e.key !== '/' || e.ctrlKey || e.metaKey || e.altKey || hasOverlay()) return;
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '') || document.activeElement?.isContentEditable) return;
      const el = document.querySelector('.main [data-search]');
      if (el) { e.preventDefault(); el.focus(); el.select?.(); }
    };
    // 标签页长时间隐藏后回来，静默刷新配置（其它会话可能改过）
    let hiddenAt = 0;
    const onVis = () => {
      if (document.visibilityState === 'hidden') { hiddenAt = Date.now(); return; }
      if (hiddenAt && Date.now() - hiddenAt > 60e3 && appStore.get().configLoaded) loadConfig().catch(noop);
    };
    addEventListener('keydown', onKey);
    document.addEventListener('visibilitychange', onVis);
    return () => { removeEventListener('keydown', onKey); document.removeEventListener('visibilitychange', onVis); };
  }, []);

  if (!configLoaded) return html`<${BootScreen} error=${bootError} onRetry=${boot} />`;

  let page;
  switch (route.route) {
    case 'channels': page = route.arg ? html`<${ChannelDetailPage} key=${route.arg} ckey=${route.arg} />` : html`<${ChannelsPage} />`; break;
    case 'clientkeys': page = html`<${ClientKeysPage} />`; break;
    case 'logs': page = html`<${LogsPage} />`; break;
    case 'stats': page = html`<${StatsPage} />`; break;
    case 'settings': page = html`<${SettingsPage} />`; break;
    case 'detector': page = html`<${DetectorPage} />`; break;
    default: page = html`<${DashboardPage} />`;
  }

  return html`
    <div class=${cx('shell', navOpen && 'nav-open')}>
      <${Sidebar} />
      <div class="nav-backdrop" onClick=${closeNav}></div>
      <main class="main">${page}</main>
      <${TabBar} />
    </div>`;
}

function Root() {
  return html`<${App} /><${OverlayHost} /><${MenuHost} /><${ToastHost} />`;
}

window.__gateway = { appStore, api, loadConfig, loadStats, refreshAll };
render(html`<${Root} />`, document.getElementById('app'));
})();
  </script>
</body>
</html>
