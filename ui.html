/* ---------- router (hash) ---------- */
const ROUTES = {
  dashboard: { title: '总览', icon: 'home' },
  channels: { title: '渠道', icon: 'layers' },
  clientkeys: { title: '调用 Key', icon: 'key' },
  logs: { title: '日志', icon: 'list' },
  stats: { title: '统计', icon: 'chart' },
  detector: { title: '模型检测', icon: 'search' },
  settings: { title: '设置', icon: 'settings' },
};

function safeDecode(s) {
  try { return decodeURIComponent(s); } catch { return s; }
}

function parseHash() {
  const raw = (location.hash || '').replace(/^#\/?/, '');
  const [pathPart] = raw.split('?');
  const parts = pathPart.split('/');
  const route = ROUTES[parts[0]] ? parts[0] : 'dashboard';
  return { route, arg: parts.slice(1).map(safeDecode).join('/') };
}

function hrefFor(route, arg = '') {
  return `#/${route}${arg ? `/${encodeURIComponent(arg)}` : ''}`;
}

function navigate(route, arg = '') {
  const next = hrefFor(route, arg);
  if (location.hash !== next) location.hash = next;
}

const routeStore = createStore(parseHash());
addEventListener('hashchange', () => {
  routeStore.set(parseHash());
  window.scrollTo(0, 0);
});
const useRoute = () => useStore(routeStore);

/* ---------- theme ---------- */
const THEME_KEY = 'gatewayTheme'; // 与旧版保持同一个 localStorage 键
const themeStore = createStore({ mode: localStorage.getItem(THEME_KEY) || 'dark' });
const systemLight = matchMedia('(prefers-color-scheme: light)');
function resolvedTheme(mode = themeStore.get().mode) {
  if (mode === 'system') return systemLight.matches ? 'light' : 'dark';
  return mode === 'light' ? 'light' : 'dark';
}
function applyTheme() {
  document.documentElement.dataset.theme = resolvedTheme();
}
function setThemeMode(mode) {
  try { localStorage.setItem(THEME_KEY, mode); } catch { /* ignore */ }
  themeStore.set({ mode });
  applyTheme();
}
systemLight.addEventListener?.('change', () => { if (themeStore.get().mode === 'system') applyTheme(); });
applyTheme();

/* ==========================================================================
   03 · overlays — modal / drawer stack, confirm & prompt, menus, toasts
   ========================================================================== */
const overlayStore = createStore({ stack: [] });
let overlaySeq = 0;

// 打开一个浮层组件，返回 Promise，组件调用 close(value) 时 resolve。
function openOverlay(Component, props = {}, opts = {}) {
  closeMenu();
  return new Promise(resolve => {
    const entry = {
      id: ++overlaySeq, Component, props, opts, resolve,
      guard: { current: null },
      returnFocus: document.activeElement,
    };
    overlayStore.set(s => ({ stack: [...s.stack, entry] }));
  });
}

function closeOverlay(id, value) {
  const entry = overlayStore.get().stack.find(e => e.id === id);
  if (!entry) return;
  overlayStore.set(s => ({ stack: s.stack.filter(e => e.id !== id) }));
  entry.resolve(value);
  const el = entry.returnFocus;
  if (el && typeof el.focus === 'function' && document.contains(el)) {
    setTimeout(() => { try { el.focus({ preventScroll: true }); } catch { /* ignore */ } }, 0);
  }
}

async function requestClose(entry) {
  if (entry.guard.current) {
    let ok = false;
    try { ok = await entry.guard.current(); } catch { ok = false; }
    if (!ok) return;
  }
  closeOverlay(entry.id, undefined);
}

const hasOverlay = () => overlayStore.get().stack.length > 0;

const FOCUSABLE = 'a[href], button:not([disabled]), input:not([disabled]):not([type="hidden"]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';

function trapTab(e, root) {
  if (e.key !== 'Tab' || !root) return;
  const nodes = [...root.querySelectorAll(FOCUSABLE)].filter(n => n.offsetParent !== null);
  if (!nodes.length) return;
  const first = nodes[0];
  const last = nodes[nodes.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}

function OverlayLayer({ entry }) {
  const { Component, props, opts } = entry;
  const ref = useRef(null);
  const downOnSelf = useRef(false);
  useEffect(() => {
    const root = ref.current;
    if (!root) return;
    const target = root.querySelector('[data-autofocus]')
      || root.querySelector('input:not([type="hidden"]):not([disabled]):not([type="checkbox"]), textarea:not([disabled])')
      || root.querySelector('.modal, .drawer');
    if (target) {
      if (!target.hasAttribute('tabindex') && !/^(INPUT|TEXTAREA|SELECT|BUTTON|A)$/.test(target.tagName)) target.setAttribute('tabindex', '-1');
      setTimeout(() => { try { target.focus({ preventScroll: true }); } catch { /* ignore */ } }, 20);
    }
  }, []);
  const dismissable = opts.dismissable !== false;
  const kind = opts.kind === 'drawer' ? 'drawer-overlay' : 'modal-overlay';
  return html`
    <div class=${cx('overlay', kind)} ref=${ref}
      onPointerDown=${e => { downOnSelf.current = e.target === e.currentTarget; }}
      onPointerUp=${e => {
        const selecting = Boolean(window.getSelection?.()?.toString());
        if (dismissable && downOnSelf.current && e.target === e.currentTarget && !selecting) requestClose(entry);
        downOnSelf.current = false;
      }}
      onKeyDown=${e => trapTab(e, ref.current)}>
      <${Component} ...${props}
        close=${value => closeOverlay(entry.id, value)}
        requestClose=${() => requestClose(entry)}
        setGuard=${fn => { entry.guard.current = fn; }} />
    </div>`;
}

function OverlayHost() {
  const stack = useStore(overlayStore, s => s.stack);
  useEffect(() => {
    document.body.classList.toggle('scroll-lock', stack.length > 0);
  }, [stack.length]);
  useEffect(() => {
    const onKey = e => {
      if (e.key !== 'Escape' || menuStore.get().menu) return;
      const top = overlayStore.get().stack.at(-1);
      if (!top || top.opts.dismissable === false) return;
      e.preventDefault();
      requestClose(top);
    };
    addEventListener('keydown', onKey);
    return () => removeEventListener('keydown', onKey);
  }, []);
  return html`${stack.map(entry => html`<${OverlayLayer} key=${entry.id} entry=${entry} />`)}`;
}

/* ---------- frames ---------- */
function Modal({ title, sub, size, children, footer, onClose, busy, bodyClass }) {

function PromptDialog({ title = '输入', label, value = '', placeholder = '', hint, okText = '确定', mono = true, multiline = false, validate, preview, close }) {
  const [text, setText] = useState(value);
  const [error, setError] = useState('');

  };
  const onKey = e => {

  };
  const previewNode = preview ? preview(text) : null;
  return html`
    <${Modal} title=${title} onClose=${() => close(null)} footer=${html`
      ${multiline ? html`<span class="foot-left">Ctrl + Enter 提交</span>` : null}
      <${Button} onClick=${() => close(null)}>取消<//>
      <${Button} variant="primary" onClick=${submit}>${okText}<//>`}>
      <div class="field">
        ${label ? html`<label class="field-label">${label}</label>` : null}
        ${multiline
          ? html`<textarea class=${cx('textarea', mono && 'mono', error && 'invalid')} rows="6" value=${text} placeholder=${placeholder}
              onInput=${e => { setText(e.currentTarget.value); setError(''); }} onKeyDown=${onKey} data-autofocus></textarea>`
          : html`<input class=${cx('input', mono && 'mono', error && 'invalid')} value=${text} placeholder=${placeholder}
              onInput=${e => { setText(e.currentTarget.value); setError(''); }} onKeyDown=${onKey} data-autofocus
              ref=${el => { if (el && !el.dataset.sel) { el.dataset.sel = '1'; setTimeout(() => el.select(), 30); } }} />`}
        ${error ? html`<div class="field-error">${error}</div>` : hint ? html`<div class="field-hint">${hint}</div>` : null}
        ${previewNode}

    <//>`;
}

/* ---------- dropdown menu ---------- */
const menuStore = createStore({ menu: null });
let menuSeq = 0;

function openMenu(anchor, items, { align = 'end' } = {}) {
  const current = menuStore.get().menu;
  if (current && current.anchor === anchor) { closeMenu(); return; }
  menuStore.set({ menu: { id: ++menuSeq, anchor, rect: anchor.getBoundingClientRect(), items: items.filter(Boolean), align } });
}
function closeMenu() {
  if (menuStore.get().menu) menuStore.set({ menu: null });
}

function MenuHost() {
  const menu = useStore(menuStore, s => s.menu);
  const ref = useRef(null);
  const [pos, setPos] = useState(null);
  useLayoutEffect(() => {
    setPos(null);
    if (!menu || !ref.current) return;
    const el = ref.current;
    const mw = el.offsetWidth;
    const mh = el.offsetHeight;
    let left = menu.align === 'start' ? menu.rect.left : menu.rect.right - mw;
    left = clamp(left, 8, Math.max(8, innerWidth - mw - 8));
    let top = menu.rect.bottom + 5;
    if (top + mh > innerHeight - 8) top = Math.max(8, menu.rect.top - mh - 5);
    setPos({ left, top });
  }, [menu]);
  useEffect(() => {
    if (!menu) return undefined;
    const onDown = e => {
      if (ref.current?.contains(e.target) || menu.anchor.contains(e.target)) return;
      closeMenu();
    };
    const onKey = e => {
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeMenu(); menu.anchor.focus?.(); return; }
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        const items = [...(ref.current?.querySelectorAll('.menu-item:not(:disabled)') || [])];
        if (!items.length) return;
        e.preventDefault();
        const i = items.indexOf(document.activeElement);
        const next = e.key === 'ArrowDown' ? (i + 1) % items.length : (i <= 0 ? items.length - 1 : i - 1);
        items[next].focus();
      }
    };
    const onViewport = e => { if (!ref.current?.contains(e.target)) closeMenu(); };
    document.addEventListener('pointerdown', onDown, true);
    document.addEventListener('keydown', onKey, true);
    document.addEventListener('scroll', onViewport, true);
    addEventListener('resize', closeMenu);
    return () => {
      document.removeEventListener('pointerdown', onDown, true);
      document.removeEventListener('keydown', onKey, true);
      document.removeEventListener('scroll', onViewport, true);
      removeEventListener('resize', closeMenu);
    };
  }, [menu]);
  if (!menu) return null;
  const style = pos ? `left:${pos.left}px;top:${pos.top}px` : 'left:0;top:0;visibility:hidden';
  return html`
    <div class="menu" ref=${ref} style=${style} role="menu" key=${menu.id}>
      ${menu.items.map((item, i) => {
        if (item.divider) return html`<div class="menu-sep" key=${`d${i}`}></div>`;
        if (item.header) return html`<div class="menu-label" key=${`h${i}`}>${item.label}</div>`;
        return html`
          <button key=${i} type="button" role="menuitem" class=${cx('menu-item', item.danger && 'danger')} disabled=${item.disabled} title=${item.title}
            onClick=${() => { closeMenu(); runAction(item.onClick); }}>
            ${item.icon ? html`<${Icon} name=${item.icon} />` : null}
            <span>${item.label}</span>
            ${item.hint ? html`<span class="menu-hint">${item.hint}</span>` : null}
          </button>`;
      })}
    </div>`;
}

function MenuButton({ items, icon = 'more', label, variant = 'ghost', size = 'sm', align = 'end', title = '更多操作', iconRight, disabled, collapse }) {
  const iconOnly = !label;
  return html`
    <${Button} variant=${variant} size=${size} icon=${icon} iconOnly=${iconOnly} title=${title} iconRight=${iconRight} disabled=${disabled} collapse=${collapse}
      onClick=${e => { e.stopPropagation(); openMenu(e.currentTarget, typeof items === 'function' ? items() : items, { align }); }}>${label}<//>`;
}

/* ---------- toasts ---------- */
const toastStore = createStore({ list: [] });
let toastSeq = 0;
const TOAST_MS = { ok: 2600, info: 3200, err: 5600 };

function dismissToast(id) {
  toastStore.set(s => ({ list: s.list.filter(t => t.id !== id) }));
}

function toast(message, type = 'ok', { duration } = {}) {
  const id = ++toastSeq;
  toastStore.set(s => ({ list: [...s.list, { id, message: String(message ?? ''), type }].slice(-4) }));
  const schedule = t => {
    const ms = duration ?? TOAST_MS[t] ?? 0;
    if (ms) setTimeout(() => dismissToast(id), ms);
  };
  if (type !== 'loading') schedule(type);
  return {
    update(msg, nextType) {
      toastStore.set(s => ({ list: s.list.map(t => (t.id === id ? { ...t, message: String(msg), type: nextType || t.type } : t)) }));
      if (nextType && nextType !== 'loading') schedule(nextType);
    },
    close: () => dismissToast(id),
  };
}

function reportError(err, prefix = '') {
  if (!err || err.name === 'AbortError') return;
  if (err.status === 401) return; // 正在跳转登录
  console.error(err);
  toast(`${prefix}${err.message || String(err)}`, 'err');
}

// 执行按钮 / 菜单动作：同步或异步都可，异常统一以 toast 呈现。
function runAction(fn, ...args) {
  if (typeof fn !== 'function') return undefined;
  try {
    const r = fn(...args);
    if (r && typeof r.then === 'function') return r.catch(err => reportError(err));
    return r;
  } catch (err) {
    reportError(err);
    return undefined;
  }
}

function ToastHost() {
  const list = useStore(toastStore, s => s.list);
  const icon = { ok: 'checkCircle', err: 'alert', info: 'info' };
  return html`
    <div class="toasts" aria-live="polite">
      ${list.map(t => html`
        <div key=${t.id} class=${cx('toast', t.type)} onClick=${() => dismissToast(t.id)} title="点击关闭">
          ${t.type === 'loading' ? html`<span class="spinner sm"></span>` : html`<${Icon} name=${icon[t.type] || 'info'} />`}
          <span class="toast-msg">${t.message}</span>
        </div>`)}
    </div>`;
}

function Button({
  variant, size, icon, iconRight, iconOnly, loading, disabled, onClick, title,
  children, type = 'button', block, class: klass, autofocus, collapse, ...rest
}) {
  const [busy, setBusy] = useState(false);
  const mounted = useMounted();
  const handle = e => {
    if (!onClick) return;
    const r = runAction(onClick, e);
    if (r && typeof r.then === 'function') {
      setBusy(true);
      r.finally(() => { if (mounted.current) setBusy(false); });
    }
  };
  const isLoading = Boolean(loading || busy);
  const hasText = children != null && children !== false && children !== '';
  return html`
    <button type=${type} class=${cx('btn', variant, size, (iconOnly || !hasText) && icon && 'icon', block && 'block', isLoading && 'loading', klass)}
      disabled=${disabled || isLoading} title=${title} aria-label=${iconOnly ? title : undefined}
      data-autofocus=${autofocus ? '' : undefined} onClick=${handle} ...${rest}>
      ${icon ? html`<${Icon} name=${icon} />` : null}
      ${hasText ? (collapse ? html`<span class="btn-label">${children}</span>` : children) : null}
      ${iconRight ? html`<${Icon} name=${iconRight} />` : null}
      ${isLoading ? html`<span class="btn-spin"><span class="spinner sm"></span></span>` : null}
    </button>`;
}

function Delta({ current, previous, invert = false }) {
  if (!previous) return current ? html`<span class="delta up">新增</span>` : null;
  const pct = ((current - previous) / previous) * 100;
  if (!Number.isFinite(pct)) return null;
  const up = pct >= 0;
  const good = invert ? !up : up;
  return html`<span class=${cx('delta', Math.abs(pct) < 0.5 ? '' : good ? 'up' : 'down')}>
    <${Icon} name=${up ? 'arrowUp' : 'arrowDown'} />${Math.abs(pct) >= 1000 ? '>999' : Math.abs(pct).toFixed(Math.abs(pct) < 10 ? 1 : 0)}%
  </span>`;
}

function SearchInput({ value = '', onChange, placeholder = '搜索…', delay = 220, size, class: klass, hotkey = false, icon = 'search' }) {
  const [text, setText] = useState(value);
  const inputRef = useRef(null);
  const cb = useRef(onChange);
  cb.current = onChange;
  const deb = useMemo(() => debounce(v => cb.current?.(v), delay), [delay]);
  useEffect(() => () => deb.cancel(), [deb]);
  useEffect(() => {
    if (value !== text && document.activeElement !== inputRef.current) setText(value);
  }, [value]);
  const clear = () => {
    setText('');
    deb.cancel();
    cb.current?.('');
    inputRef.current?.focus();
  };
  return html`
    <div class=${cx('search', klass)}>
      <${Icon} name=${icon} />
      <input ref=${inputRef} class=${cx('input', size)} value=${text} placeholder=${placeholder} spellcheck="false"
        data-search=${hotkey ? '' : undefined}
        onInput=${e => { const v = e.currentTarget.value; setText(v); deb(v); }}
        onKeyDown=${e => {
          if (e.key === 'Escape' && text) { e.preventDefault(); e.stopPropagation(); clear(); }
          else if (e.key === 'Enter') { deb.cancel(); cb.current?.(text); }
        }} />
      ${text
        ? html`<${Button} variant="ghost" size="xs" icon="x" iconOnly title="清除 (Esc)" class="search-clear" onClick=${clear} />`
        : hotkey ? html`<span class="search-kbd kbd">/</span>` : null}
    </div>`;
}

function Pager({ page, totalPages, total, onPage, pageSize, pageSizes, onPageSize, unit = '条' }) {
  const [jump, setJump] = useState(String(page));
  useEffect(() => setJump(String(page)), [page]);
  const pages = Math.max(1, totalPages || 1);
  const go = () => {
    const p = clamp(Math.floor(Number(jump) || 1), 1, pages);
    setJump(String(p));
    if (p !== page) onPage(p);
  };
  return html`
    <div class="pager">
      <span class="pager-info">共 ${fmtNum(total)} ${unit}</span>
      ${pageSizes ? html`
        <select class="select sm auto" value=${String(pageSize)} onChange=${e => onPageSize(e.currentTarget.value === 'all' ? 'all' : Number(e.currentTarget.value))} title="每页条数">
          ${pageSizes.map(n => html`<option value=${String(n)}>${n === 'all' ? '全部' : `${n} ${unit}/页`}</option>`)}
        </select>` : null}
      <${Button} size="sm" icon="chevsL" iconOnly title="第一页" disabled=${page <= 1} onClick=${() => onPage(1)} />
      <${Button} size="sm" icon="chevL" iconOnly title="上一页" disabled=${page <= 1} onClick=${() => onPage(page - 1)} />
      <span class="pager-page">${page} / ${pages}</span>
      <${Button} size="sm" icon="chevR" iconOnly title="下一页" disabled=${page >= pages} onClick=${() => onPage(page + 1)} />
      <${Button} size="sm" icon="chevsR" iconOnly title="最后一页" disabled=${page >= pages} onClick=${() => onPage(pages)} />
      ${pages > 2 ? html`
        <input class="input sm" type="number" min="1" max=${pages} value=${jump} title="跳转到页"
          onInput=${e => setJump(e.currentTarget.value)} onKeyDown=${e => { if (e.key === 'Enter') go(); }} />
        <${Button} size="sm" onClick=${go}>跳转<//>` : null}
    </div>`;
}

// 可搜索的多选列表（调用 Key 的渠道/模型范围、探测结果等）。
function Picker({ items, selected, onChange, placeholder = '搜索…', emptyText = '暂无可选项', summary, height = 220 }) {
  const [q, setQ] = useState('');
  const query = q.trim().toLowerCase();
  const visible = query
    ? items.filter(it => `${it.label} ${it.sub || ''} ${it.value}`.toLowerCase().includes(query))
    : items;
  const setMany = on => {
    const next = new Set(selected);
    for (const it of visible) {
      if (on && !it.disabled) next.add(it.value);
      if (!on) next.delete(it.value);
    }
    onChange(next);
  };
  const toggle = (value, on) => {
    const next = new Set(selected);
    if (on) next.add(value); else next.delete(value);
    onChange(next);
  };
  return html`
    <div class="picker">
      <div class="picker-head">
        <${SearchInput} size="sm" value=${q} onChange=${setQ} delay=${60} placeholder=${placeholder} />
        <${Button} size="xs" onClick=${() => setMany(true)}>${query ? '全选结果' : '全选'}<//>
        <${Button} size="xs" onClick=${() => setMany(false)}>${query ? '清空结果' : '清空'}<//>
        <span class="picker-sum">${summary ? summary(selected.size, visible.length) : `已选 ${selected.size}`}</span>
      </div>
      <div class="picker-list" style=${`max-height:${height}px`}>
        ${visible.length ? visible.map(it => html`
          <label key=${it.value} class=${cx('picker-item', it.disabled && 'disabled')} title=${it.note || it.title || it.label}>
            <input type="checkbox" checked=${selected.has(it.value)} disabled=${it.disabled && !selected.has(it.value)}
              onChange=${e => toggle(it.value, e.currentTarget.checked)} />
            <span class=${cx('pi-label', it.mono && 'mono')}>${it.label}</span>
            ${it.note || it.sub ? html`<span class=${cx('pi-sub', it.note && 'warn-text')}>${it.note || it.sub}</span>` : null}
          </label>`) : html`<div class="picker-empty">${query ? '没有匹配项' : emptyText}</div>`}
      </div>
    </div>`;
}

function LiveTime({ ts, prefix = '', fallback = '—' }) {
  useNow();
  const ms = toMs(ts);
  if (!Number.isFinite(ms)) return html`<span class="faint">${fallback}</span>`;
  return html`<span title=${fmtTime(ms)} class="nowrap">${prefix}${fmtRelative(ms)}</span>`;
}

/* ==========================================================================
   05 · charts — responsive SVG bar chart, ranking list
   ========================================================================== */
// 让 4 条网格线都落在「整」数上：先求每格步长再取整到 1/2/2.5/3/4/5/6/7.5/8/10 × 10^n。
function niceTop(v, ticks = 4, integer = true) {
  if (!(v > 0)) return ticks;
  const raw = v / ticks;
  const exp = Math.pow(10, Math.floor(Math.log10(raw)));
  const f = raw / exp;
  const nf = [1, 2, 2.5, 3, 4, 5, 6, 7.5, 8, 10].find(x => f <= x + 1e-9) || 10;
  let step = nf * exp;
  if (integer) step = Math.max(1, Math.ceil(step));
  return step * ticks;
}

// data: [{ key, label, requests, tokens, ... }]；metric 决定柱高取哪个字段。
function BarChart({ data, metric = 'requests', height = 210, tip, emptyText = '所选时间范围内暂无数据', highlightIndex = -1 }) {
  const ref = useRef(null);
  const width = useElementWidth(ref);
  const [hover, setHover] = useState(-1);
  const values = data.map(d => num(d[metric]));
  const maxV = values.length ? Math.max(...values) : 0;
  const empty = !data.length || maxV <= 0;

  const padL = 48;
  const padR = 6;
  const padT = 12;
  const padB = 24;
  const w = Math.max(width, 160);
  const innerW = w - padL - padR;
  const innerH = height - padT - padB;
  const top = niceTop(maxV, 4, metric !== 'tokens');
  const band = data.length ? innerW / data.length : innerW;
  const barW = clamp(band * 0.64, 1.5, 40);
  const labelEvery = Math.max(1, Math.ceil(data.length / Math.max(1, Math.floor(innerW / 46))));
  const fmtAxis = metric === 'tokens' ? fmtCompact : v => (v >= 1e4 ? fmtCompact(v) : fmtNum(Math.round(v)));
  const barHeight = i => (values[i] > 0 ? Math.max(2, (values[i] / top) * innerH) : 0);

  let tipNode = null;
  if (!empty && hover >= 0 && hover < data.length) {
    const cxPos = clamp(padL + hover * band + band / 2, 70, Math.max(70, w - 70));
    const y = padT + innerH - barHeight(hover) - 8;
    const d = data[hover];
    tipNode = html`
      <div class="chart-tip" style=${`left:${cxPos}px;top:${Math.max(y, 34)}px`}>
        ${tip ? tip(d) : html`
          <div class="faint">${d.key}</div>
          <div><b>${fmtNum(d.requests)}</b> 次请求 · <b>${fmtCompact(d.tokens)}</b> tok</div>`}
      </div>`;
  }

  return html`
    <div class="chart" ref=${ref} style=${`min-height:${height}px`} onPointerLeave=${() => setHover(-1)}>
      ${empty ? html`<${Empty} icon="chart" title=${emptyText} compact />` : width > 0 ? html`
        <svg width=${w} height=${height} viewBox=${`0 0 ${w} ${height}`} role="img">
          ${[0, 0.25, 0.5, 0.75, 1].map(f => {
            const y = Math.round(padT + innerH * (1 - f)) + 0.5;
            return html`<g key=${`g${f}`}>
              <line class="c-grid" x1=${padL} x2=${w - padR} y1=${y} y2=${y} />
              <text class="c-axis" x=${padL - 8} y=${y + 3.5} text-anchor="end">${fmtAxis(top * f)}</text>
            </g>`;
          })}
          ${data.map((d, i) => {
            const bh = barHeight(i);
            const x = padL + i * band + (band - barW) / 2;
            const y = padT + innerH - bh;
            const hot = hover === i || (hover < 0 && highlightIndex === i);
            return html`<g key=${d.key}>
              ${hover === i ? html`<rect class="c-hover" x=${padL + i * band} y=${padT} width=${band} height=${innerH} rx="3" />` : null}
              ${bh > 0 ? html`<rect class=${cx('c-bar', hover >= 0 && hover !== i && 'dim', hot && 'hot')} x=${x} y=${y} width=${barW} height=${bh} rx=${Math.min(3, barW / 2)} />` : null}
              ${i % labelEvery === 0 ? html`<text class="c-axis" x=${padL + i * band + band / 2} y=${height - 7} text-anchor="middle">${d.label}</text>` : null}
              <rect class="c-band" x=${padL + i * band} y=${padT} width=${band} height=${innerH + padB}
                onPointerEnter=${() => setHover(i)} onPointerDown=${() => setHover(i)} />
            </g>`;
          })}
        </svg>` : null}
      ${tipNode}
    </div>`;
}

function ChartLegend({ data, metric }) {
  if (!data.length) return null;
  const total = data.reduce((a, p) => ({ requests: a.requests + num(p.requests), tokens: a.tokens + num(p.tokens) }), { requests: 0, tokens: 0 });
  const peak = data.reduce((best, p) => (num(p[metric]) > num(best[metric]) ? p : best), data[0]);
  const active = data.filter(p => num(p.requests) > 0).length;
  const avg = active ? total[metric] / data.length : 0;
  const f = metric === 'tokens' ? v => `${fmtCompact(v)} tok` : v => `${fmtNum(Math.round(v))} 次`;
  return html`
    <div class="chart-legend">
      <span>合计 <b>${fmtNum(total.requests)}</b> 次请求</span>
      <span><b>${fmtCompact(total.tokens)}</b> tok</span>
      ${num(peak[metric]) > 0 ? html`<span>峰值 <b>${peak.label}</b>（${f(num(peak[metric]))}）</span>` : null}
      <span>平均 <b>${f(avg)}</b> / ${data.length === 24 ? '小时' : '天'}</span>
    </div>`;
}

function usageEntries(usage = {}, metric = 'requests') {
  return Object.entries(usage || {})
    .map(([name, it]) => ({ name, requests: num(it?.count ?? it?.requests), tokens: num(it?.tokens) }))
    .filter(e => e.requests > 0 || e.tokens > 0)
    .sort((a, b) => (metric === 'tokens'
      ? b.tokens - a.tokens || b.requests - a.requests
      : b.requests - a.requests || b.tokens - a.tokens));
}

function RankList({ usage, metric = 'requests', limit = 8, expandable = true, emptyText = '暂无统计数据', nameOf }) {
  const [expanded, setExpanded] = useState(false);
  const entries = useMemo(() => usageEntries(usage, metric), [usage, metric]);
  if (!entries.length) return html`<${Empty} icon="chart" title=${emptyText} compact />`;
  const shown = expanded ? entries : entries.slice(0, limit);
  const valueOf = e => (metric === 'tokens' ? e.tokens : e.requests);
  const max = Math.max(1, ...entries.map(valueOf));
  const total = entries.reduce((s, e) => s + valueOf(e), 0);
  return html`
    <div class="rank">
      ${shown.map((e, i) => {
        const v = valueOf(e);
        const label = nameOf ? nameOf(e.name) : e.name;
        return html`
          <div class="rank-row" key=${e.name}>
            <div class="rank-head">
              <span class="rank-name" title=${e.name}><span class="rank-idx">${i + 1}</span>${label}</span>
              <span class="rank-val">${metric === 'tokens' ? `${fmtCompact(e.tokens)} tok` : `${fmtNum(e.requests)} 次`}</span>
            </div>
            <div class="rank-bar"><i style=${`width:${v ? Math.max(1.5, (v / max) * 100) : 0}%`}></i></div>
            <div class="rank-sub">${metric === 'tokens' ? `${fmtNum(e.requests)} 次请求` : `${fmtCompact(e.tokens)} tok`} · 占 ${fmtPct(v, total)}</div>
          </div>`;
      })}
      ${expandable && entries.length > limit ? html`
        <button type="button" class="link-btn rank-more" onClick=${() => setExpanded(!expanded)}>
          ${expanded ? '收起' : `展开全部 ${entries.length} 项`}
        </button>` : null}
    </div>`;
}

/* ==========================================================================
   06 · data — loading, derived statistics (北京时间), log helpers
   ========================================================================== */
const noop = () => {};
let configSeq = 0;

async function loadConfig() {
  const seq = ++configSeq;
  const d = await api.get('/api/config');
  if (seq !== configSeq) return; // 有更新的请求已发出，丢弃过期结果
  appStore.set({
    channels: isObj(d.channels) ? d.channels : {},
    websiteButtons: Array.isArray(d.website_buttons) ? d.website_buttons : [],
    clientKeys: Array.isArray(d.api_keys) ? d.api_keys : [],
    configLoaded: true,
  });
}

let statsInflight = null;
function loadStats() {
  if (statsInflight) return statsInflight;
  statsInflight = api.get('/api/stats')
    .then(d => { appStore.set({ stats: d, statsLoaded: true, statsAt: Date.now(), statsError: '' }); })
    .catch(err => { appStore.set({ statsLoaded: true, statsError: err.message }); throw err; })
    .finally(() => { statsInflight = null; });
  return statsInflight;
}

function refreshAll() {
  return Promise.all([loadConfig(), loadStats().catch(noop)]);
}

// 进入页面 / 切回标签页时，若统计数据已过期则后台静默刷新。
function useStatsRevalidate(maxAge = 20e3, every = 0) {
  useEffect(() => {
    const check = () => {
      if (document.visibilityState === 'hidden') return;
      if (Date.now() - appStore.get().statsAt > maxAge) loadStats().catch(noop);
    };
    check();
    document.addEventListener('visibilitychange', check);
    // 停留在页面上时定期静默刷新（有弹窗打开时跳过，避免打断操作）
    const timer = every ? setInterval(() => { if (!hasOverlay()) check(); }, every) : null;
    return () => { document.removeEventListener('visibilitychange', check); if (timer) clearInterval(timer); };
  }, [maxAge, every]);
}

/* ---------- derived statistics ---------- */
function mergeUsage(target, source) {
  if (!isObj(source)) return target;
  for (const [name, it] of Object.entries(source)) {
    const t = target[name] || (target[name] = { count: 0, tokens: 0 });
    t.count += num(it?.count ?? it?.requests);
    t.tokens += num(it?.tokens);
  }
  return target;
}

const statsIndexCache = new WeakMap();

// 后端的 dailyStats / hourlyStats 都按 UTC 分桶；这里用小时桶重建「北京时间自然日」，
// 没有小时数据覆盖的旧日期才回退使用 UTC 日桶（标记 approx）。
function statsIndex(stats) {
  if (!stats) return null;
  const cached = statsIndexCache.get(stats);
  if (cached) return cached;
  const days = new Map();
  const hours = [];
  const ensureDay = key => {
    let d = days.get(key);
    if (!d) {
      d = { key, requests: 0, tokens: 0, models: {}, channels: {}, ips: {}, hours: Array.from({ length: 24 }, () => ({ requests: 0, tokens: 0 })), hasHourly: false, approx: false };
      days.set(key, d);
    }
    return d;
  };
  const utcDaysWithHourly = new Set();
  for (const [k, b] of Object.entries(stats.hourlyStats || {})) {
    const ms = Date.parse(`${k}:00:00Z`);
    if (!Number.isFinite(ms) || !isObj(b)) continue;
    utcDaysWithHourly.add(k.slice(0, 10));
    const r = num(b.requests);
    const t = num(b.tokens);
    const d = ensureDay(bjDateKey(ms));
    d.requests += r;
    d.tokens += t;
    d.hasHourly = true;
    const hb = d.hours[bjHourOf(ms)];
    hb.requests += r;
    hb.tokens += t;
    mergeUsage(d.models, b.models);
    mergeUsage(d.channels, b.channels);
    mergeUsage(d.ips, b.ips);
    hours.push({ ms, requests: r, tokens: t, models: b.models || {} });
  }
  for (const [k, b] of Object.entries(stats.dailyStats || {})) {
    if (utcDaysWithHourly.has(k) || !isObj(b)) continue;
    const d = ensureDay(k);
    d.requests += num(b.requests);
    d.tokens += num(b.tokens);
    d.approx = true;
    mergeUsage(d.models, b.models);
    mergeUsage(d.channels, b.channels);
    mergeUsage(d.ips, b.ips);
  }
  hours.sort((a, b) => a.ms - b.ms);
  const dayKeys = [...days.keys()].sort();
  const recent = (Array.isArray(stats.recentLogs) ? [...stats.recentLogs] : [])
    .sort((a, b) => (toMs(b.timestamp) || 0) - (toMs(a.timestamp) || 0));
  const idx = { days, dayKeys, hours, recent, firstDay: dayKeys[0] || '' };
  statsIndexCache.set(stats, idx);
  return idx;
}

function rangeSpec(mode, start, end) {
  const today = todayKey();
  switch (mode) {
    case 'today': return { mode, label: '今天', keys: [today] };
    case 'yesterday': return { mode, label: '昨天', keys: [shiftDay(today, -1)] };
    case '7d': return { mode, label: '最近 7 天', keys: dayRange(shiftDay(today, -6), today) };
    case '30d': return { mode, label: '最近 30 天', keys: dayRange(shiftDay(today, -29), today) };
    case 'custom': {
      const s = start || shiftDay(today, -6);
      const e = end || today;
      const [a, b] = s <= e ? [s, e] : [e, s];
      return { mode, label: a === b ? a : `${a} ~ ${b}`, keys: dayRange(a, b) };
    }
    default: return { mode: 'all', label: '全部时间', keys: null };
  }
}

function daySeries(idx, keys) {
  return keys.map(k => {
    const d = idx.days.get(k);
    return { key: k, label: k.slice(5), requests: d?.requests || 0, tokens: d?.tokens || 0 };
  });
}

function hourSeries(idx, dayKey) {
  const d = idx.days.get(dayKey);
  return Array.from({ length: 24 }, (_, h) => ({
    key: `${dayKey} ${pad2(h)}:00`, label: `${pad2(h)}:00`,
    requests: d?.hours[h].requests || 0, tokens: d?.hours[h].tokens || 0,
  }));
}

function rangeView(stats, spec) {
  const out = { label: spec.label, requests: 0, tokens: 0, modelUsage: {}, channelUsage: {}, ipUsage: {}, series: [], unit: 'day', recent: [], approx: false };
  const idx = statsIndex(stats);
  if (!idx) return out;
  if (!spec.keys) {
    out.requests = num(stats.totalRequests);
    out.modelUsage = stats.modelUsage || {};
    out.channelUsage = stats.channelUsage || {};
    out.ipUsage = stats.ipUsage || {};
    out.tokens = Object.values(out.modelUsage).reduce((s, m) => s + num(m?.tokens), 0);
    const today = todayKey();
    const floor = shiftDay(today, -29);
    out.series = daySeries(idx, dayRange(idx.firstDay && idx.firstDay > floor ? idx.firstDay : floor, today));
    out.recent = idx.recent;
    return out;
  }
  for (const k of spec.keys) {
    const d = idx.days.get(k);
    if (!d) continue;
    out.requests += d.requests;
    out.tokens += d.tokens;
    mergeUsage(out.modelUsage, d.models);
    mergeUsage(out.channelUsage, d.channels);
    mergeUsage(out.ipUsage, d.ips);
    if (d.approx) out.approx = true;
  }
  if (spec.keys.length === 1) {
    out.unit = 'hour';
    out.series = hourSeries(idx, spec.keys[0]);
  } else {
    out.series = daySeries(idx, spec.keys);
  }
  const set = new Set(spec.keys);
  out.recent = idx.recent.filter(e => set.has(bjDateKey(toMs(e.timestamp))));
  return out;
}

// 最近 1 小时 / 24 小时：recentLogs（最多 100 条）能完整覆盖窗口时精确统计，
// 否则用小时桶估算（最早那一小时按比例折算），并标记为近似值。
function activityWindows(stats, now = Date.now()) {
  const idx = statsIndex(stats);
  if (!idx) return null;
  const recent = idx.recent;
  const covered = cutoff => recent.length < 100 || (toMs(recent[recent.length - 1]?.timestamp) || 0) < cutoff;
  const exact = cutoff => {
    const w = { requests: 0, tokens: 0, failures: 0, models: {}, exact: true };
    for (const e of recent) {
      const t = toMs(e.timestamp);
      if (!(t >= cutoff)) continue;
      w.requests++;
      w.tokens += num(e.tokens);
      if (e.success === false) w.failures++;
      mergeUsage(w.models, { [String(e.model || 'unknown')]: { count: 1, tokens: num(e.tokens) } });
    }
    return w;
  };
  const approx = hoursBack => {
    const cur = Math.floor(now / HOUR) * HOUR;
    const frac = (now - cur) / HOUR;
    const start = cur - hoursBack * HOUR;
    const w = { requests: 0, tokens: 0, failures: null, models: {}, exact: false };
    for (const hb of idx.hours) {
      if (hb.ms < start || hb.ms > cur) continue;
      const weight = hb.ms === start ? 1 - frac : 1;
      w.requests += hb.requests * weight;
      w.tokens += hb.tokens * weight;
      mergeUsage(w.models, hb.models);
    }
    w.requests = Math.round(w.requests);
    w.tokens = Math.round(w.tokens);
    return w;
  };
  const windowOf = ms => (covered(now - ms) ? exact(now - ms) : approx(Math.round(ms / HOUR)));

  const tk = bjDateKey(now);
  const td = idx.days.get(tk);
  const yd = idx.days.get(shiftDay(tk, -1));
  const bjH = bjHourOf(now);
  const hourFrac = ((now + TZ_OFFSET) % HOUR) / HOUR;
  let same = null;
  if (yd?.hasHourly) {
    same = { requests: 0, tokens: 0 };
    for (let h = 0; h < bjH; h++) { same.requests += yd.hours[h].requests; same.tokens += yd.hours[h].tokens; }
    same.requests = Math.round(same.requests + yd.hours[bjH].requests * hourFrac);
    same.tokens = Math.round(same.tokens + yd.hours[bjH].tokens * hourFrac);
  }
  return {
    lastHour: windowOf(HOUR),
    last24h: windowOf(DAY),
    today: { requests: td?.requests || 0, tokens: td?.tokens || 0, models: td?.models || {} },
    yesterday: { requests: yd?.requests || 0, tokens: yd?.tokens || 0, models: yd?.models || {}, same },
    latest: recent[0]?.timestamp || '',
  };
}

// 滚动的最近 24 个小时（含当前小时），用于总览页的活动图。
function last24Series(stats, now = Date.now()) {
  const idx = statsIndex(stats);
  if (!idx) return [];
  const cur = Math.floor(now / HOUR) * HOUR;
  const byMs = new Map(idx.hours.map(hb => [hb.ms, hb]));
  return Array.from({ length: 24 }, (_, i) => {
    const ms = cur - (23 - i) * HOUR;
    const hb = byMs.get(ms);
    const p = bjParts(ms);
    return {
      key: `${pad2(p.mo)}-${pad2(p.d)} ${pad2(p.h)}:00${i === 23 ? '（进行中）' : ''}`,
      label: `${pad2(p.h)}:00`,
      requests: hb?.requests || 0,
      tokens: hb?.tokens || 0,
    };
  });
}

const errorIndexCache = new WeakMap();
// 错误数来自调用 Key 维度的累计统计（按渠道名拆分），是目前唯一带失败计数的全量数据。
function errorIndex(stats) {
  const empty = { requests: 0, errors: 0, byChannel: {} };
  if (!stats) return empty;
  const cached = errorIndexCache.get(stats);
  if (cached) return cached;
  const out = { requests: 0, errors: 0, byChannel: {} };
  for (const u of Object.values(stats.clientKeyUsage || {})) {
    out.requests += num(u?.totalRequests);
    out.errors += num(u?.totalErrors);
    for (const [ch, c] of Object.entries(u?.byChannel || {})) {
      const t = out.byChannel[ch] || (out.byChannel[ch] = { requests: 0, errors: 0, lastUsedAt: '' });
      t.requests += num(c?.totalRequests);
      t.errors += num(c?.totalErrors);
      if (c?.lastUsedAt && String(c.lastUsedAt) > t.lastUsedAt) t.lastUsedAt = String(c.lastUsedAt);
    }
  }
  errorIndexCache.set(stats, out);
  return out;
}

function channelAgg(ch = {}, stats) {
  const k = channelKeyStats(ch);
  const usage = stats?.channelUsage?.[ch.name] || {};
  const err = errorIndex(stats).byChannel[ch.name] || {};
  return {
    ...k,
    models: Array.isArray(ch.models) ? ch.models.length : 0,
    requests: num(usage.count),
    tokens: num(usage.tokens),
    errors: num(err.errors),
    errRequests: num(err.requests),
    lastUsedAt: err.lastUsedAt || '',
  };
}

function globalAgg(channels = {}, stats) {
  const agg = { channels: 0, channelsEnabled: 0, keys: 0, keysDisabled: 0, models: 0, requests: num(stats?.totalRequests), tokens: 0 };
  for (const ch of Object.values(channels)) {
    agg.channels++;
    if (isEnabled(ch)) agg.channelsEnabled++;
    const k = channelKeyStats(ch);
    agg.keys += k.total;
    agg.keysDisabled += k.disabled;
    agg.models += Array.isArray(ch.models) ? ch.models.length : 0;
  }
  agg.tokens = Object.values(stats?.modelUsage || {}).reduce((s, m) => s + num(m?.tokens), 0);
  return agg;
}

const channelDisplayName = name => (name === 'none' ? '（未路由）' : name === 'unknown' ? '（未知）' : name);

function allModelItems(channels = {}) {
  const seen = new Map();
  for (const [ckey, ch] of Object.entries(channels)) {
    for (const m of ch.models || []) {
      if (seen.has(m)) continue;
      seen.set(m, { value: m, label: m, sub: ch.name || ckey, mono: true, disabled: !isEnabled(ch), note: isEnabled(ch) ? '' : `${ch.name || ckey} 已停用` });
    }
  }
  return [...seen.values()];
}

/* ---------- log helpers ---------- */
const LOG_EVENT_LABELS = {
  request_complete: '请求完成',
  chat_request: '收到请求',
  upstream_request: '请求上游',
  model_routed: '模型路由',
  model_partial_match: '模型模糊匹配',
  model_legacy_alias: '旧模型别名',
  chat_rejected: '请求被拒绝',
  auto_truncate_injected: '注入截断提示',
  upstream_key_disabled: 'Key 自动禁用',
  anthropic_stream_parse_error: '流解析错误',
  http_request: 'HTTP 请求',
  parse_error: '日志解析错误',
  read_error: '日志读取错误',
};
const logEventLabel = ev => LOG_EVENT_LABELS[ev] || ev || '—';

function logClass(entry = {}) {
  const ev = String(entry.event || '');
  if (entry.autoTruncated) return 'warn';
  if (num(entry.statusCode) >= 400) return 'err';
  if (/error|not_found|rejected|invalid|disabled/.test(ev)) return 'err';
  if (/filtered|timeout|partial|alias/.test(ev)) return 'warn';
  return 'ok';
}

const logModel = e => e.model || e.requestedModel || e.upstreamModel || e.realModel || '';
const logChannel = e => e.channel || e.channelKey || '';
const logInputTokens = e => num(e.inputTokens ?? e.promptTokens ?? e.input_tokens);
const logOutputTokens = e => num(e.outputTokens ?? e.completionTokens ?? e.output_tokens);
const logIp = e => e.clientIp || e.ip || e.client || '';

function logStatusLabel(entry = {}) {
  if (entry.autoTruncated) return '已截断';
  const status = entry.statusCode != null && entry.statusCode !== '' ? String(entry.statusCode) : '';
  const cls = logClass(entry);
  if (cls === 'err') return status || '失败';
  if (cls === 'warn') return status || '警告';
  return status || '成功';
}

function logSummary(entry = {}) {
  const fields = [
    entry.errorMessage,
    entry.error,
    entry.responseBody,
    entry.outputContent,
    entry.upstreamHost && entry.upstreamPath ? `${entry.upstreamHost}${entry.upstreamPath}` : '',
    entry.reason,
    entry.url,
    entry.raw,
  ];
  const s = fields.find(v => v != null && typeof v !== 'object' && String(v).trim());
  return s ? String(s).replace(/\s+/g, ' ').slice(0, 300) : '';
}

async function setChannelEnabled(ckey, enable) {
  const ch = appStore.get().channels[ckey];
  if (!ch) return;
  if (!enable) {
    const ok = await confirmDialog({
      title: '停用渠道',
      message: `确定停用渠道「${ch.name || ckey}」？\n停用后该渠道的 ${ch.models?.length || 0} 个模型将无法调用；配置、上游 Key 与模型列表都会保留，可随时重新启用。`,
      okText: '停用',
      danger: true,
    });

  appStore.set(s => ({ channels: { ...s.channels, [ckey]: { ...s.channels[ckey], enabled: enable } } }));

function useKeyDash(ckey) {
  const [state, setState] = useState({ data: null, loading: true, error: '' });
  const seq = useRef(0);
  const tick = useStore(keyDashBus, s => s.ticks[ckey] || 0);
  const reload = useCallback(async ({ silent = true } = {}) => {
    const my = ++seq.current;
    setState(s => ({ ...s, loading: true }));
    try {
      const d = await api.get(`/api/config/channel-keys?channelKey=${encodeURIComponent(ckey)}`);
      if (my === seq.current) setState({ data: d, loading: false, error: '' });
    } catch (err) {
      if (my === seq.current) setState(s => ({ data: s.data, loading: false, error: err.message }));
      if (!silent) throw err;
    }
  }, [ckey]);
  useEffect(() => {
    setState({ data: null, loading: true, error: '' });
    reload();
  }, [ckey]);
  useEffect(() => { if (tick) reload(); }, [tick]);
  return [state, reload];
}

  quota_exhausted: '额度耗尽',
  expired: '已过期',
  banned: '已封禁',
  account_disabled: '账号已停用',
  rate_limited: '触发限流',
};
function reasonLabel(code = '') {
  const c = String(code || '');
  if (!c) return '';
  if (KEY_REASONS[c]) return KEY_REASONS[c];
  const m = c.match(/^http_(\d{3})$/);
  return m ? `HTTP ${m[1]}` : c;
}

function keyReasonText(r) {
  const parts = [];
  if (!r.enabled && r.disabledReason) parts.push(reasonLabel(r.disabledReason));
  if (r.lastError && r.lastError !== r.disabledReason) parts.push(r.lastError);
  return uniq(parts).join(' · ');
}

function activeKeysOf(ch = {}) {
  const forced = new Set(ch.force_enabled_keys || []);
  const disabled = new Set(ch.disabled_keys || []);
  return channelKeysOf(ch).filter(k => forced.has(k) || !disabled.has(k));
}

      actions=${html`

        <${Button} size="sm" icon="power" collapse onClick=${() => setChannelEnabled(ckey, !on)}>${on ? '停用' : '启用'}<//>
        <${Button} size="sm" icon="edit" collapse onClick=${() => openChannelEditor(ckey)}>编辑<//>

    <div class="page-body">
      <${Card}>
        <div class="info-grid">
          <div class="info-block">
            <div class="url-line"><${Icon} name="link" /><span title=${ch.base_url}>${ch.base_url || '—'}</span><${CopyButton} text=${ch.base_url || ''} what=" API 地址" /></div>
            <dl class="kv">
              <dt>渠道 key</dt><dd><span class="mono">${ckey}</span> <${CopyButton} text=${ckey} what="渠道 key" /></dd>
              <dt>模型前缀</dt><dd>${prefix ? html`<span class="mono">[${prefix}]</span>` : html`<span class="faint">（无前缀）</span>`}</dd>
              <dt>接口格式</dt><dd>${formatLabel(ch.format)} <span class="faint mono small">${formatEndpoint(ch.format)}</span></dd>
              ${ch.website ? html`<dt>官网</dt><dd>${isHttpUrl(ch.website) ? html`<a href=${safeHref(ch.website)} target="_blank" rel="noopener">${ch.website} ↗</a>` : ch.website}</dd>` : null}
            </dl>
          </div>
          <div class="info-block">
            ${flags.length ? html`<div class="badges">${flags}</div>` : html`<div class="small faint">未启用缓存、思考或自动截断等增强功能。</div>`}
            <dl class="kv">
              ${ch.format === 'anthropic' ? html`
                <dt>anthropic-version</dt><dd class="mono small">${ch.anthropic_version || '2023-06-01'}</dd>
                <dt>思考模式</dt><dd>${!ch.anthropic_thinking_type || ch.anthropic_thinking_type === 'off' ? '关闭'
                  : ch.anthropic_thinking_type === 'enabled' ? `enabled · 预算 ${fmtNum(ch.anthropic_thinking_budget_tokens || 32000)} tokens`
                  : `adaptive${ch.anthropic_output_effort ? ` · effort ${ch.anthropic_output_effort}` : ''}${ch.anthropic_thinking_display ? ` · ${ch.anthropic_thinking_display}` : ''}`}</dd>` : null}
              ${ch.prompt_cache_enabled ? html`<dt>Prompt 缓存</dt><dd>TTL ${ch.prompt_cache_ttl || '5m'}</dd>` : null}
              ${ch.auto_truncate ? html`<dt>截断标记</dt><dd class="mono small">${ch.auto_truncate_marker || DEFAULT_TRUNCATE_MARKER}</dd>` : null}
              ${ch.key_strategy === 'sticky' ? html`<dt>Key 策略</dt><dd>单 Key 耗尽切换</dd>` : null}
              ${agg.lastUsedAt ? html`<dt>最近调用</dt><dd><${LiveTime} ts=${agg.lastUsedAt} /></dd>` : null}
            </dl>

        </div>
        <div class="stats-row dense" style="margin-top:16px">
          <${Stat} inset label="上游 Key" value=${html`${fmtNum(keyEnabled)}<span class="unit">/ ${fmtNum(keyTotal)}</span>`}
            sub=${keyDisabled ? html`<span class="danger-text">${fmtNum(keyDisabled)} 个已禁用</span>` : keyTotal ? '全部可用' : '还没有 Key'} />
          <${Stat} inset label="模型" value=${fmtNum(agg.models)} sub=${prefix ? `前缀 [${prefix}]` : '无前缀'} />
          <${Stat} inset label="请求" value=${fmtCompact(totals ? totals.requests : agg.requests)}
            sub=${totals?.errors ? html`<span class="danger-text">${fmtCompact(totals.errors)} 次错误</span>` : '按上游 Key 累计'} />
          <${Stat} inset label="输入 Token" value=${fmtCompact(inTok)} loading=${!totals && dash.loading} />

        : html`<${KeysPanel} ckey=${ckey} ch=${ch} dash=${dash} reload=${reloadDash} />`}
    </div>`;

/* ---------------------------- Key 管理 ---------------------------- */
const KEY_FILTERS = {
  all: () => true,
  enabled: r => r.enabled,
  disabled: r => !r.enabled,
  forced: r => r.forceEnabled,
  failed: r => r.lastTestPassed === false || (r.lastStatus >= 400),
};

function KeysPanel({ ckey, ch, dash, reload }) {
  const rows = dash.data?.keys || [];
  const [q, setQ] = useSessionState(`keys.q.${ckey}`, '');
  const [filter, setFilter] = useSessionState(`keys.filter.${ckey}`, 'all');
  const [pageSize, setPageSize] = usePref('keys.pageSize', 50);
  const [page, setPage] = useState(1);
  const [sel, setSel] = useState(() => new Set());
  const anchor = useRef(null);

  const rowMap = useMemo(() => new Map(rows.map(r => [r.key, r])), [rows]);
  useEffect(() => {
    setSel(prev => {
      const next = new Set([...prev].filter(k => rowMap.has(k)));
      return next.size === prev.size ? prev : next;
    });
  }, [rowMap]);

  const query = q.trim().toLowerCase();
  const counts = useMemo(() => Object.fromEntries(Object.entries(KEY_FILTERS).map(([k, fn]) => [k, rows.filter(fn).length])), [rows]);
  const filtered = useMemo(() => rows.filter(r => {
    if (!(KEY_FILTERS[filter] || KEY_FILTERS.all)(r)) return false;
    if (!query) return true;
    return [r.key, r.maskedKey, r.disabledReason, reasonLabel(r.disabledReason), r.lastError, r.lastStatus, r.disabledStatus, `#${r.index + 1}`]
      .map(v => String(v ?? '').toLowerCase()).join(' ').includes(query);
  }), [rows, filter, query]);
  useEffect(() => setPage(1), [filter, query, pageSize, ckey]);

  const size = pageSize === 'all' ? Math.max(1, filtered.length) : pageSize;
  const pages = Math.max(1, Math.ceil(filtered.length / size));
  const cur = Math.min(page, pages);
  const pageRows = filtered.slice((cur - 1) * size, cur * size);
  const pageAllSel = pageRows.length > 0 && pageRows.every(r => sel.has(r.key));
  const pageSomeSel = pageRows.some(r => sel.has(r.key));
  const allFilteredSel = filtered.length > 0 && filtered.every(r => sel.has(r.key));
  const selKeys = [...sel];

  const after = () => Promise.all([reload(), loadConfig().catch(noop)]);
  const mutate = async (path, body, okMsg) => {
    const d = await api.post(path, { channelKey: ckey, ...body });
    if (okMsg) toast(typeof okMsg === 'function' ? okMsg(d) : okMsg);
    await after();
    return d;
  };

  const toggleRow = (key, checked, shift) => {
    setSel(prev => {
      const next = new Set(prev);
      if (shift && anchor.current && anchor.current !== key) {
        const a = filtered.findIndex(r => r.key === anchor.current);
        const b = filtered.findIndex(r => r.key === key);
        if (a >= 0 && b >= 0) {
          const [lo, hi] = a < b ? [a, b] : [b, a];
          for (let i = lo; i <= hi; i++) { if (checked) next.add(filtered[i].key); else next.delete(filtered[i].key); }
          return next;
        }
      }
      if (checked) next.add(key); else next.delete(key);
      return next;
    });
    anchor.current = key;
  };
  const togglePage = checked => setSel(prev => {
    const next = new Set(prev);
    for (const r of pageRows) { if (checked) next.add(r.key); else next.delete(r.key); }
    return next;
  });

  const bulkToggle = async enable => {
    const targets = selKeys.filter(k => { const r = rowMap.get(k); return r && (enable ? !r.enabled : r.enabled && !r.forceEnabled); });
    const verb = enable ? '启用' : '禁用';
    if (!targets.length) {
      toast(enable ? '选中的 Key 都已可用' : '选中的 Key 已全部禁用（强启的 Key 需先取消强启）', 'info');
      return;
    }
    if (!enable && !await confirmDialog({ title: '批量禁用', message: `禁用选中的 ${targets.length} 个 Key？被禁用的 Key 不会参与轮询，可随时恢复。`, okText: '禁用' })) return;
    const t = toast(`正在${verb} 0/${targets.length}…`, 'loading');
    let failed = 0;
    await runPool(targets, key => api.post(`/api/config/channel-keys/${enable ? 'enable' : 'disable'}`, { channelKey: ckey, key }), {
      concurrency: 3,
      onProgress: (done, total, res) => { if (!res.ok) failed++; t.update(`正在${verb} ${done}/${total}…`); },
    });
    t.update(failed ? `已${verb} ${targets.length - failed} 个，${failed} 个失败` : `已${verb} ${targets.length} 个 Key`, failed ? 'err' : 'ok');
    await after();
  };

  const deleteKeys = async keys => {
    if (!keys.length) return;
    if (keys.length >= rows.length) { toast('不能删除全部 Key，渠道至少要保留一个', 'err'); return; }
    const ok = await confirmDialog({ title: '删除 Key', message: `删除选中的 ${keys.length} 个 Key？此操作不可恢复。`, okText: '删除', danger: true });
    if (!ok) return;
    await mutate('/api/config/channel-keys/delete-batch', { keys }, d => `已删除 ${d.deleted ?? keys.length} 个 Key，剩余 ${d.total ?? '—'} 个`);
    setSel(new Set());
  };

  const testOne = async r => {
    const d = await api.post('/api/config/channel-keys/test', { channelKey: ckey, key: r.key, reenable: true }, { allowFail: true });
    if (d.pass) toast(`${maskKey(r.key)} 测试通过${d.reenabled ? '，已自动恢复' : ''}：${d.reply || '(ok)'}`);
    else toast(`${maskKey(r.key)} 测试失败：${d.error || d.reason || '未知错误'}${d.autoDisabled ? '（已自动禁用）' : ''}`, 'err');
    await after();
  };

  const editKey = async r => {
    const next = await promptDialog({
      title: '修改 Key',
      label: `新的 Key（#${r.index + 1}，保留原有的禁用 / 强启状态与统计）`,
      value: r.key,
      okText: '保存',
      validate: v => {
        const t = v.trim();
        if (!t) return 'Key 不能为空';
        if (t !== r.key && rowMap.has(t)) return '该 Key 已存在于本渠道';
        return '';
      },
    });
    if (next == null || next.trim() === r.key) return;
    await mutate('/api/config/channel-keys/edit', { key: r.key, newKey: next.trim() }, '已更新 Key');
  };

  const deleteOne = async r => {
    if (rows.length <= 1) { toast('渠道至少要保留一个 Key', 'err'); return; }
    if (!await confirmDialog({ title: '删除 Key', message: `删除 Key ${maskKey(r.key)}（#${r.index + 1}）？此操作不可恢复。`, okText: '删除', danger: true })) return;
    await mutate('/api/config/channel-keys/delete', { key: r.key }, '已删除');
  };

  const exportItems = [
    { header: true, label: '从服务端导出（.txt）' },
    { label: '全部 Key', icon: 'download', hint: String(counts.all), onClick: () => downloadFrom(`/api/config/channel-keys/export?channelKey=${encodeURIComponent(ckey)}&only=all`, `${ckey}-keys.txt`).then(n => toast(`已导出 ${n}`)) },
    { label: '可用 Key', icon: 'download', hint: String(counts.enabled), onClick: () => downloadFrom(`/api/config/channel-keys/export?channelKey=${encodeURIComponent(ckey)}&only=enabled`, `${ckey}-keys-enabled.txt`).then(n => toast(`已导出 ${n}`)) },
    { label: '已禁用 Key', icon: 'download', hint: String(counts.disabled), onClick: () => downloadFrom(`/api/config/channel-keys/export?channelKey=${encodeURIComponent(ckey)}&only=disabled`, `${ckey}-keys-disabled.txt`).then(n => toast(`已导出 ${n}`)) },
    { divider: true },
    { label: '当前筛选结果', icon: 'filter', hint: String(filtered.length), disabled: !filtered.length, onClick: () => { downloadText(`${ckey}-keys-filtered.txt`, `${filtered.map(r => r.key).join('\n')}\n`); toast(`已导出 ${filtered.length} 个 Key`); } },
  ];
  const moreItems = [
    { label: '恢复全部已禁用', icon: 'restore', disabled: !counts.disabled, onClick: async () => {
      if (!await confirmDialog({ title: '恢复全部', message: `恢复该渠道全部 ${counts.disabled} 个已禁用的 Key？`, okText: '全部恢复' })) return;
      await mutate('/api/config/channel-keys/enable-all', {}, d => `已恢复 ${d.enabled || 0} 个 Key`);
    } },
    { label: '全部强制启用', icon: 'shield', onClick: async () => {
      if (!await confirmDialog({ title: '全部强制启用', message: '将该渠道所有 Key 设为强制启用？\n强启的 Key 即使请求失败也不会被自动禁用。', okText: '全部强启' })) return;
      await mutate('/api/config/channel-keys/force-enable', { all: true, enabled: true }, '已将全部 Key 设为强制启用');
    } },
    { label: '取消全部强启', icon: 'shieldOff', disabled: !counts.forced, onClick: () => mutate('/api/config/channel-keys/force-enable', { all: true, enabled: false }, '已取消全部强制启用') },
    { divider: true },
    { label: '删除全部已禁用', icon: 'trash', danger: true, disabled: !counts.disabled, onClick: async () => {
      if (!await confirmDialog({ title: '删除已禁用 Key', message: `删除该渠道全部 ${counts.disabled} 个已禁用的 Key？此操作不可恢复。`, okText: '删除', danger: true })) return;
      await mutate('/api/config/channel-keys/delete-disabled', {}, d => `已删除 ${d.deleted || 0} 个 Key，剩余 ${d.total ?? '—'} 个`);
    } },
  ];
  const rowItems = r => [
    r.forceEnabled
      ? { label: '取消强制启用', icon: 'shieldOff', onClick: () => mutate('/api/config/channel-keys/force-enable', { key: r.key, enabled: false }, '已取消强制启用') }
      : { label: '强制启用', icon: 'shield', title: '强启后该 Key 不会被自动禁用', onClick: () => mutate('/api/config/channel-keys/force-enable', { key: r.key, enabled: true }, '已强制启用') },
    { label: '修改 Key', icon: 'edit', onClick: () => editKey(r) },
    { label: '复制完整 Key', icon: 'copy', onClick: () => copyText(r.key, { label: ' Key' }) },
    { divider: true },
    { label: '删除', icon: 'trash', danger: true, onClick: () => deleteOne(r) },
  ];

  const statusBadges = r => html`
    ${r.enabled
      ? (r.forceEnabled ? html`<${Badge} tone="info" icon="shield" title="强制启用：不会被自动禁用">强启<//>` : html`<${Badge} tone="success" dot>可用<//>`)
      : html`<${Badge} tone="danger" dot title=${r.disabledAt ? `禁用于 ${fmtTime(r.disabledAt)}` : ''}>已禁用<//>`}
    ${!r.enabled && r.disabledStatus ? html`<${Badge} tone="warn" sq>HTTP ${r.disabledStatus}<//>` : null}`;

  const loadingFirst = dash.loading && !dash.data;
  return html`
    <div class="col" style="gap:12px">
      <div class="toolbar">
        <${SearchInput} value=${q} onChange=${setQ} placeholder="搜索 Key / 序号 / 状态 / 禁用原因" hotkey />
        <${Seg} value=${filter} onChange=${setFilter} options=${[
          { value: 'all', label: '全部', count: counts.all },
          { value: 'enabled', label: '可用', count: counts.enabled },
          { value: 'disabled', label: '已禁用', count: counts.disabled },
          { value: 'forced', label: '强启', count: counts.forced },
          { value: 'failed', label: '异常', count: counts.failed, title: '最近测试失败或最近请求返回错误状态' },
        ]} />
        <span class="spacer"></span>
        <${Button} size="sm" icon="zap" onClick=${() => openBatchTest(ckey, selKeys.length ? selKeys : filtered.map(r => r.key), { reload: after, source: selKeys.length ? 'selected' : 'filtered' })}
          disabled=${!rows.length} title=${selKeys.length ? '测试选中的 Key' : '测试当前筛选出的全部 Key'}>批量测试<//>
        <${Button} size="sm" icon="upload" onClick=${() => openKeyImport(ckey, rows.map(r => r.key), after)}>导入<//>
        <${MenuButton} items=${exportItems} icon="download" label="导出" variant="" iconRight="chevD" title="导出 Key" />
        <${MenuButton} items=${moreItems} variant="" title="更多批量操作" />
        <${Button} size="sm" icon="refresh" iconOnly title="刷新 Key 状态" loading=${dash.loading && Boolean(dash.data)}
          onClick=${async () => { await Promise.all([reload({ silent: false }), loadConfig()]); toast('Key 状态已刷新'); }} />
      </div>

      ${selKeys.length ? html`
        <div class="select-bar">
          <span class="sb-count">已选 ${selKeys.length} 个</span>
          <${Button} size="xs" icon="zap" onClick=${() => openBatchTest(ckey, selKeys, { reload: after, source: 'selected' })}>测试<//>
          <${Button} size="xs" icon="check" onClick=${() => bulkToggle(true)}>启用<//>
          <${Button} size="xs" icon="power" onClick=${() => bulkToggle(false)}>禁用<//>
          <${Button} size="xs" icon="shield" onClick=${() => mutate('/api/config/channel-keys/force-enable', { keys: selKeys, enabled: true }, `已强制启用 ${selKeys.length} 个 Key`)}>强启<//>
          <${Button} size="xs" icon="shieldOff" onClick=${() => mutate('/api/config/channel-keys/force-enable', { keys: selKeys, enabled: false }, `已取消 ${selKeys.length} 个 Key 的强启`)}>取消强启<//>
          <${Button} size="xs" icon="download" onClick=${() => { downloadText(`${ckey}-keys-selected.txt`, `${selKeys.join('\n')}\n`); toast(`已导出 ${selKeys.length} 个 Key`); }}>导出<//>
          <${Button} size="xs" icon="copy" onClick=${() => copyText(selKeys.join('\n'), { label: ` ${selKeys.length} 个 Key` })}>复制<//>
          <${Button} size="xs" variant="danger" icon="trash" onClick=${() => deleteKeys(selKeys)}>删除<//>
          <span class="spacer"></span>
          <${Button} size="xs" variant="ghost" icon="x" onClick=${() => setSel(new Set())}>取消选择<//>
        </div>` : null}
      ${pageAllSel && filtered.length > pageRows.length ? html`
        <div class="select-note">
          ${allFilteredSel
            ? html`<span>已选择全部 <b>${filtered.length}</b> 个匹配的 Key。</span><button type="button" class="link-btn" onClick=${() => setSel(new Set())}>清除选择</button>`
            : html`<span>已选择本页 <b>${pageRows.length}</b> 个。</span><button type="button" class="link-btn" onClick=${() => setSel(new Set(filtered.map(r => r.key)))}>选择全部 ${filtered.length} 个匹配的 Key</button>`}
        </div>` : null}

      <div class="table-wrap">
        ${loadingFirst ? html`<div style="padding:16px"><${SkeletonRows} rows=${6} h=${40} /></div>`
          : dash.error && !dash.data ? html`<${Empty} icon="alert" title="Key 状态加载失败" desc=${dash.error} action=${html`<${Button} size="sm" icon="refresh" onClick=${() => reload({ silent: false })}>重试<//>`} />`
          : !filtered.length ? html`<${Empty} icon="key" title=${rows.length ? '没有匹配的 Key' : '该渠道还没有 Key'}
              desc=${rows.length ? '换个关键词或筛选条件试试。' : '点击「导入」批量添加上游 Key，每行一个。'}
              action=${rows.length ? null : html`<${Button} size="sm" variant="primary" icon="upload" onClick=${() => openKeyImport(ckey, [], after)}>导入 Key<//>`} />`
          : html`
          <table class="table stack cols-3">
            <thead><tr>
              <th class="cb"><${Checkbox} checked=${pageAllSel} indeterminate=${pageSomeSel} onChange=${togglePage} title="选择本页" /></th>
              <th>#</th>
              <th>Key</th>
              <th>状态</th>
              <th class="num">请求 / 错误</th>
              <th class="num">Token 入 / 出</th>
              <th>最近使用</th>
              <th>最近测试</th>
              <th class="actions-cell">操作</th>
            </tr></thead>
            <tbody>
              ${pageRows.map(r => {
                const reason = keyReasonText(r);
                return html`
                  <tr key=${r.id || r.key} class=${cx('has-cb', sel.has(r.key) && 'selected', !r.enabled && 'dim')}>
                    <td class="cb"><${Checkbox} checked=${sel.has(r.key)} onChange=${(v, e) => toggleRow(r.key, v, e?.shiftKey)} title="选择（Shift 可连选）" /></td>
                    <td class="idx hide-sm">${r.index + 1}</td>
                    <td class="key-cell full">
                      <div class="row"><span class="idx show-sm">#${r.index + 1}</span><${KeyText} value=${r.key} /></div>
                      ${reason ? html`<div class="key-reason" title=${reason}>${reason}${!r.enabled && r.disabledAt ? ` · 禁用于 ${fmtTime(r.disabledAt, { year: false })}` : ''}</div>` : null}
                    </td>
                    <td data-label="状态"><div class="badges nowrap">${statusBadges(r)}</div></td>
                    <td class="num" data-label="请求 / 错误">${fmtCompact(r.totalRequests)} <span class=${r.totalErrors ? 'danger-text' : 'faint'}>/ ${fmtCompact(r.totalErrors)}</span></td>
                    <td class="num" data-label="Token 入 / 出">${fmtCompact(r.totalInputTokens)} <span class="faint">/</span> ${fmtCompact(r.totalOutputTokens)}</td>
                    <td data-label="最近使用"><div class="row" style="gap:6px">
                      <${LiveTime} ts=${r.lastUsedAt} fallback="从未" />
                      ${r.lastStatus ? html`<${Badge} sq tone=${r.lastStatus >= 400 ? 'danger' : ''}>${r.lastStatus}<//>` : null}
                    </div></td>
                    <td data-label="最近测试">${r.lastTestAt ? html`<div class="row" style="gap:6px">
                      <${Badge} tone=${r.lastTestPassed ? 'success' : 'danger'} title=${r.lastTestStatus ? `HTTP ${r.lastTestStatus}` : ''}>${r.lastTestPassed ? '通过' : '失败'}<//>
                      <span class="small faint"><${LiveTime} ts=${r.lastTestAt} /></span>
                    </div>` : html`<span class="faint">—</span>`}</td>
                    <td class="actions-cell"><div class="row">
                      <${Button} size="xs" icon="zap" title="测试该 Key；禁用中的 Key 测试通过后会自动恢复" onClick=${() => testOne(r)}>测试<//>
                      ${r.enabled
                        ? html`<${Button} size="xs" disabled=${r.forceEnabled} title=${r.forceEnabled ? '强启中的 Key 需先取消强启' : '禁用该 Key'} onClick=${() => mutate('/api/config/channel-keys/disable', { key: r.key }, '已禁用')}>禁用<//>`
                        : html`<${Button} size="xs" onClick=${() => mutate('/api/config/channel-keys/enable', { key: r.key }, '已启用')}>启用<//>`}
                      <${MenuButton} size="xs" items=${() => rowItems(r)} />
                    </div></td>
                  </tr>`;
              })}
            </tbody>
          </table>`}
      </div>
      ${filtered.length > 20 || pages > 1 ? html`
        <${Pager} page=${cur} totalPages=${pages} total=${filtered.length} onPage=${setPage} unit="个"
          pageSize=${pageSize} pageSizes=${[20, 50, 100, 200, 'all']} onPageSize=${setPageSize} />` : null}
    </div>`;
}

function ModelsPanel({ ckey, ch }) {
  const models = Array.isArray(ch.models) ? ch.models : [];
  const [q, setQ] = useSessionState(`models.q.${ckey}`, '');
  const [results, setResults] = useState({});
  const prefix = channelPrefixOf(ckey, ch);
  const params = isObj(ch.model_params) ? ch.model_params : {};
  const overrides = isObj(ch.model_overrides) ? ch.model_overrides : {};
  const query = q.trim().toLowerCase();
  const visible = query ? models.filter(m => m.toLowerCase().includes(query)) : models;

  const addModels = async () => {
    const parse = v => uniq(normalizeModelsForPrefix(String(v).split(/[\r\n,]+/).map(s => s.trim()).filter(Boolean), prefix, prefix));
    const text = await promptDialog({
      title: '添加模型',
      label: `模型名（可一次添加多个，用逗号或换行分隔）`,
      placeholder: prefix ? `例如 gpt-4o, gpt-4o-mini（自动加前缀 [${prefix}]）` : '例如 gpt-4o, gpt-4o-mini',
      multiline: true,
      okText: '添加',
      validate: v => {
        const list = parse(v);
        if (!list.length) return '请输入至少一个模型名';
        if (list.every(m => models.includes(m))) return '这些模型都已存在';
        return '';
      },
      preview: v => {
        const list = parse(v);
        if (!list.length) return null;
        return html`<div class="field-hint">将添加：${list.map(m => html`<span class=${cx('badge mono sq', models.includes(m) && 'outline')} style="margin:2px 4px 0 0" title=${models.includes(m) ? '已存在，将跳过' : ''}>${m}</span>`)}</div>`;
      },
    });
    if (text == null) return;
    const list = parse(text).filter(m => !models.includes(m));
    let added = 0;
    for (const model of list) {
      await api.post('/api/config/add-model', { channelKey: ckey, model });
      added++;
    }
    toast(`已添加 ${added} 个模型`);
    await loadConfig();
  };

  const removeModel = async m => {
    if (!await confirmDialog({ title: '移除模型', message: `从渠道「${ch.name || ckey}」移除模型：\n${m}`, okText: '移除', danger: true })) return;
    await api.post('/api/config/remove-model', { channelKey: ckey, model: m });
    toast('模型已移除');
    await loadConfig();
  };

  const testModel = async m => {
    const key = activeKeysOf(ch)[0];
    if (!key) { toast('该渠道没有可用的 Key', 'err'); return; }
    setResults(r => ({ ...r, [m]: { pending: true } }));
    try {
      const d = await api.post('/api/config/channel-keys/batch-test', { channelKey: ckey, model: m, keys: [key], concurrency: 1, autoDisable: false, reenable: false });
      const res = d.results?.[0] || {};
      setResults(r => ({ ...r, [m]: { pass: Boolean(res.pass), msg: res.pass ? (res.reply || '(ok)') : (res.error || res.reason || '测试失败'), status: res.status } }));
      if (res.pass) toast(`${m} 可用：${res.reply || '(ok)'}`);
      else toast(`${m} 测试失败：${res.error || res.reason || '未知错误'}`, 'err');
    } catch (err) {
      setResults(r => ({ ...r, [m]: { pass: false, msg: err.message } }));
      throw err;
    }
  };

  return html`
    <div class="col" style="gap:12px">
      <div class="toolbar">
        <${SearchInput} value=${q} onChange=${setQ} placeholder="搜索模型" hotkey />
        <span class="tb-meta">${query ? `${visible.length} / ${models.length} 个匹配` : `${models.length} 个模型`}</span>
        <span class="spacer"></span>
        <${Button} size="sm" icon="copy" disabled=${!models.length} onClick=${() => copyText(models.join(', '), { label: `全部 ${models.length} 个模型名` })}>复制全部<//>
        <${Button} size="sm" icon="edit" onClick=${() => openChannelEditor(ckey)} title="在渠道编辑器中批量调整或探测上游模型">批量编辑<//>
        <${Button} size="sm" variant="primary" icon="plus" onClick=${addModels}>添加模型<//>
      </div>
      <div class="card">
        ${visible.length ? html`
          <div class="model-list">
            ${visible.map(m => {
              const up = hasOwn(overrides, m) && String(overrides[m] || '').trim() ? upstreamModelName(String(overrides[m]).trim(), ckey) : upstreamModelName(m, ckey);
              const r = results[m];
              return html`
                <div class="model-row" key=${m}>
                  <div class="grow">
                    <div class="model-name" title=${m}>${m}</div>
                    <div class="model-up" title="实际发往上游的模型名">→ ${up}</div>
                  </div>
                  ${hasOwn(params, m) ? html`<${Badge} icon="sliders" title=${`附加参数：${JSON.stringify(params[m])}`}>参数<//>` : null}
                  ${r && !r.pending ? html`<${Badge} tone=${r.pass ? 'success' : 'danger'} title=${r.msg}>${r.pass ? '可用' : '失败'}<//>` : null}
                  <${Button} size="xs" icon="zap" loading=${r?.pending} disabled=${!isEnabled(ch)} title=${isEnabled(ch) ? '用第一个可用 Key 测试该模型（失败不会禁用 Key）' : '渠道已停用'} onClick=${() => testModel(m)}>测试<//>
                  <${CopyButton} text=${m} what="模型名" />
                  <${Button} size="xs" variant="ghost" icon="trash" iconOnly title="移除模型" onClick=${() => removeModel(m)} />
                </div>`;
            })}
          </div>` : html`
          <${Empty} icon="cpu" title=${models.length ? '没有匹配的模型' : '该渠道还没有模型'}
            desc=${models.length ? '' : '点「添加模型」手动填写，或在编辑器里「探测上游模型」后勾选。'}
            action=${models.length ? null : html`<${Button} size="sm" variant="primary" icon="plus" onClick=${addModels}>添加模型<//>`} />`}
      </div>
    </div>`;
}
