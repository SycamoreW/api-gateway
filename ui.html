        $('#chAutoTruncateFields').style.display = e.target.checked ? '' : 'none';
      });

      /* ----- probe models ----- */
      const currentPrefix = () => $('#chPrefix').value.trim();
      const visibleProbed = (q = '') => {
        const query = q.trim().toLowerCase();
        return query ? probedModels.filter(m => String(m).toLowerCase().includes(query)) : probedModels;
      };
      const applyProbedToInput = () => {
        const prefix = currentPrefix();
        const bare = (m) => stripOwnModelPrefix(m, prefix).toLowerCase();
        const probedBare = new Map(probedModels.map(m => [bare(m), m]));
        const selectedBare = new Set(probedModels.filter(m => probedSelected.has(m)).map(bare));
        const fmt = (m) => prefix ? `[${prefix}]${stripOwnModelPrefix(m, prefix)}` : m;
        // 按原顺序保留：非探测结果的模型原样保留；探测命中的按勾选状态增删，新勾选的追加到末尾
        const current = $('#chModels').value.split(',').map(m => m.trim()).filter(Boolean);
        const out = [];
        const seen = new Set();
        for (const m of current) {
          const b = bare(m);
          if (!probedBare.has(b)) { out.push(m); continue; }   // 手动添加/已下线：保留
          if (selectedBare.has(b)) { out.push(fmt(probedBare.get(b))); seen.add(b); }
        }
        for (const m of probedModels) {
          const b = bare(m);
          if (probedSelected.has(m) && !seen.has(b)) out.push(fmt(m));
        }
        $('#chModels').value = out.join(', ');
      };
      const renderProbeList = () => {
        const q = $('#chProbeSearch').value;
        const visible = visibleProbed(q);
        $('#chProbeList').innerHTML = visible.length
          ? visible.map(m => `<label class="check"><input type="checkbox" value="${esc(m)}" ${probedSelected.has(m) ? 'checked' : ''}><span class="mono">${esc(m)}</span></label>`).join('')
          : `<div class="fs12 faint" style="padding:6px 2px">无匹配模型</div>`;
        $('#chProbeSummary').textContent = `${visible.length}/${probedModels.length} 匹配 · 已选 ${probedSelected.size}`;
      };
      $('#chProbe').onclick = async () => {
        const url = $('#chUrl').value.trim();
        const key = isNew
          ? parseKeyList($('#chKeys')?.value || '')[0] || ''
          : channelKeysOf(ch)[0] || '';
        const result = $('#chProbeResult');
        if (!url || !key) { result.textContent = '请先填写 API 地址和至少一个 Key'; return; }
        result.textContent = '探测中…';
        $('#chProbe').disabled = true;
        try {
          const d = await api('/api/probe-models', {
            method: 'POST',
            body: JSON.stringify({ base_url: url, key, format: $('#chFormat').value, channelKey: isNew ? '' : editKey }),
          });
          if (!d.ok || !Array.isArray(d.models)) {
            result.textContent = `探测失败: ${d.error || '未知错误'}`;
            $('#chProbePicker').style.display = 'none';
            return;
          }
          if (!d.models.length) {
            result.textContent = '上游没有返回模型';
            $('#chProbePicker').style.display = 'none';
            return;
          }
          result.textContent = `发现 ${d.models.length} 个模型，勾选后自动填入下方列表`;
          probedModels = d.models.map(String);
          // 预选当前输入框里已有的模型（按去前缀后的名字匹配），避免勾选时丢失已配置模型
          const prefix = currentPrefix();
          const existingBare = new Set($('#chModels').value.split(',').map(m => m.trim()).filter(Boolean).map(m => stripOwnModelPrefix(m, prefix).toLowerCase()));
          probedSelected = new Set(probedModels.filter(m => existingBare.has(stripOwnModelPrefix(m, prefix).toLowerCase())));
          $('#chProbePicker').style.display = '';
          renderProbeList();
        } catch (e) {
          result.textContent = `探测失败: ${e.message}`;
          $('#chProbePicker').style.display = 'none';
        } finally {
          $('#chProbe').disabled = false;
        }
      };
      $('#chProbeSearch').addEventListener('input', debounce(renderProbeList, 120));
      $('#chProbeList').addEventListener('change', e => {
        const cb = e.target.closest('input[type="checkbox"]');
        if (!cb) return;
        if (cb.checked) probedSelected.add(cb.value);
        else probedSelected.delete(cb.value);
        renderProbeList();
        applyProbedToInput();
      });
      $('#chProbeSelAll').onclick = () => { visibleProbed($('#chProbeSearch').value).forEach(m => probedSelected.add(m)); renderProbeList(); applyProbedToInput(); };
      $('#chProbeSelNone').onclick = () => { visibleProbed($('#chProbeSearch').value).forEach(m => probedSelected.delete(m)); renderProbeList(); applyProbedToInput(); };

      /* ----- save ----- */
      $('#chSave').onclick = async () => {
        const name = $('#chName').value.trim();
        const prefix = currentPrefix();
        const url = $('#chUrl').value.trim();
        const models = $('#chModels').value.split(',').map(m => m.trim()).filter(Boolean);
        if (!name || !url) { toast('渠道名称和 API 地址必填', false); return; }
        if (!models.length) { toast('至少填一个模型', false); return; }
        const website = $('#chWebsite').value.trim();
        if (website && !/^https?:\/\//i.test(website)) { toast('渠道官网需以 http:// 或 https:// 开头', false); return; }
        const upstreamKeys = isNew ? parseKeyList($('#chKeys')?.value || '') : channelKeysOf(ch);
        if (isNew && !upstreamKeys.length) { toast('新渠道必须填写至少一个 API Key', false); return; }

        const fmt = $('#chFormat').value;
        const promptCacheEnabled = $('#chPromptCacheEnabled').checked;
        const thinking = fmt === 'anthropic' ? $('#chThinkingType').value : 'off';
        const payload = {
          channelKey: isNew ? (prefix || makeChannelKey(name, url)) : (prefix || editKey),
          name,
          base_url: url,
          key: upstreamKeys[0] || '',
          keys: upstreamKeys,
          models: normalizeModelsForPrefix(models, prefix, isNew ? '' : channelPrefixOf(editKey, ch)),
          model_prefix: prefix,
          website,
          enabled: $('#chEnabled').checked,
          auto_truncate: $('#chAutoTruncate').checked,
          auto_truncate_marker: $('#chAutoTruncateMarker').value.trim() || '<answer>',
          auto_truncate_prompt: $('#chAutoTruncatePrompt').value || '',
          ...(fmt ? { format: fmt } : {}),
          ...(fmt === 'anthropic' ? { anthropic_version: $('#chAnthropicVersion').value.trim() || '2023-06-01' } : {}),
          prompt_cache_enabled: promptCacheEnabled,
          prompt_cache_ttl: promptCacheEnabled ? $('#chPromptCacheTtl').value : '1h',
          anthropic_thinking_type: thinking,
          anthropic_thinking_budget_tokens: Number($('#chThinkingBudget').value) || 32000,
          anthropic_output_effort: $('#chOutputEffort').value || '',
          anthropic_thinking_display: $('#chThinkingDisplay').value || '',
          isNew,
          ...(isNew ? {} : { previousChannelKey: editKey }),
        };
        $('#chSave').disabled = true;
        try {
          const d = await api('/api/config/save', { method: 'POST', body: JSON.stringify(payload) });
          if (d.ok === false) { toast(d.error || '保存失败', false); $('#chSave').disabled = false; return; }
          toast(isNew ? '渠道已添加' : '渠道已更新');
          closeModal();
          await refreshAll();
          if (!isNew && S.route === 'channels' && S.routeArg === editKey && payload.channelKey !== editKey) {
            nav('channels', payload.channelKey);
          } else {
            if (S.route === 'channels' && S.routeArg) void loadKeyDash(S.routeArg);
            renderApp();
          }
        } catch (e) {
          toast(`保存失败: ${e.message}`, false);
          $('#chSave').disabled = false;
        }
      };
      $('#chName').focus();
    }
    /* ============================================================
       View: Client keys
       ============================================================ */
    function toDatetimeLocalValue(value) {
      if (!value) return '';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '';
      return new Date(date.getTime() - date.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
    }

    function datetimeLocalToIso(value) {
      if (!value) return '';
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? '' : date.toISOString();
    }

    function allModelsList() {
      const models = [];
      for (const ch of Object.values(S.channels)) {
        for (const m of ch.models || []) if (!models.includes(m)) models.push(m);
      }
      return models;
    }

    function scopePickerItems() {
      return {
        channelItems: Object.entries(S.channels).map(([ckey, ch]) => ({ value: ckey, label: `${ch.name || ckey} (${ckey})` })),
        modelItems: allModelsList().map(m => ({ value: m, label: m })),
      };
    }

    function clientKeyStatus(entry) {
      if (entry.enabled === false) return { cls: 'off', text: '停用' };
      if (entry.expires_at && Date.parse(entry.expires_at) < Date.now()) return { cls: 'off', text: '已过期' };
      if (entry.quota_limit > 0 && entry.quota_used >= entry.quota_limit) return { cls: 'warn', text: '额度用尽' };
      return { cls: 'on', text: '有效' };
    }

    function ClientKeysView(view) {
      setTopbar(`
        <h1>调用 Key</h1>
        <div class="topbar-actions">
          <button class="btn outline sm" data-act="global-refresh">${ic('refresh')} 刷新</button>
          <button class="btn outline sm" data-act="clientkey-copy-all">${ic('copy')} 复制全部</button>
          <button class="btn primary sm" data-act="clientkey-generate">${ic('plus')} 生成 Key</button>
        </div>`);
      const entries = S.clientKeys;
      const generated = entries.filter(e => e.key_type !== 'admin');
      const active = generated.filter(e => clientKeyStatus(e).cls === 'on').length;
      const totalReq = entries.reduce((sum, e) => sum + (Number(e.usage_count) || 0), 0);
      const totalTok = entries.reduce((sum, e) => sum + (Number(e.usage_input_tokens) || 0) + (Number(e.usage_output_tokens) || 0), 0);
      view.innerHTML = `
        <div class="kpis" style="margin-bottom:14px">
          ${kpi('调用 Key', fmtNum(generated.length), { icon: 'key', sub: `${active} 个有效` })}
          ${kpi('累计请求', fmtCompact(totalReq), { icon: 'send', sub: '含管理 Key' })}
          ${kpi('累计 Token', fmtCompact(totalTok), { icon: 'database', sub: '输入 + 输出' })}
        </div>
        <div class="key-list">
          ${entries.length ? entries.map(clientKeyCard).join('') : emptyBox('还没有调用 Key，点「生成 Key」批量创建', { icon: 'key', action: `<button class="btn primary sm" data-act="clientkey-generate">${ic('plus')} 生成 Key</button>` })}
        </div>`;
      view.onclick = e => {
        const act = e.target.closest('[data-ck]');
        if (!act) return;
        const key = act.dataset.key;
        if (act.dataset.ck === 'edit') openClientKeyEditor(key);
        if (act.dataset.ck === 'delete') void deleteClientKey(key);
        if (act.dataset.ck === 'toggle') void toggleClientKey(key);
        if (act.dataset.ck === 'channels') showClientKeyUsageByChannel(key);
      };
    }

    function clientKeyCard(entry) {
      const isAdmin = entry.key_type === 'admin';
      const st = clientKeyStatus(entry);
      const scopes = [];
      if (entry.allowed_channels?.length) scopes.push(`渠道 ${entry.allowed_channels.length}`);
      if (entry.allowed_models?.length) scopes.push(`模型 ${entry.allowed_models.length}`);
      const quota = entry.quota_limit > 0 ? `${fmtNum(entry.quota_used || 0)}/${fmtNum(entry.quota_limit)}` : '';
      return `
        <div class="key-row ${st.cls === 'off' ? 'disabled' : ''}">
          <div class="key-row-top">
            <span class="key-code" data-copy="${esc(entry.key)}" title="点击复制完整 Key">${esc(maskKey(entry.key))}</span>
            ${entry.name ? `<span class="badge">${esc(entry.name)}</span>` : ''}
            ${isAdmin ? '<span class="pill info">管理 Key</span>' : `<span class="pill ${st.cls}">${st.text}</span>`}
            ${scopes.length ? `<span class="pill dim">${scopes.join(' · ')}</span>` : (isAdmin ? '' : '<span class="pill dim">不限渠道/模型</span>')}
            ${quota ? `<span class="pill ${entry.quota_used >= entry.quota_limit ? 'warn' : 'dim'}">额度 ${quota}</span>` : ''}
            ${entry.expires_at ? `<span class="pill ${Date.parse(entry.expires_at) < Date.now() ? 'off' : 'dim'}">到期 ${esc(fmtTime(entry.expires_at))}</span>` : ''}
            <div class="actions">
              <button class="btn ghost sm icon-only" data-copy="${esc(entry.key)}" title="复制">${ic('copy')}</button>
              ${entry.usage_by_channel?.length ? `<button class="btn outline sm" data-ck="channels" data-key="${esc(entry.key)}">分渠道</button>` : ''}
              ${isAdmin ? '' : `
                <button class="btn outline sm" data-ck="toggle" data-key="${esc(entry.key)}">${entry.enabled === false ? '启用' : '停用'}</button>
                <button class="btn ghost sm icon-only" data-ck="edit" data-key="${esc(entry.key)}" title="编辑">${ic('edit')}</button>
                <button class="btn ghost sm icon-only" data-ck="delete" data-key="${esc(entry.key)}" title="删除">${ic('trash')}</button>`}
            </div>
          </div>
          <div class="key-row-meta">
            <span>请求 <b>${fmtCompact(entry.usage_count || 0)}</b></span>
            <span>错误 <b>${fmtCompact(entry.usage_errors || 0)}</b></span>
            <span>输入 <b>${fmtCompact(entry.usage_input_tokens || 0)}</b></span>
            <span>输出 <b>${fmtCompact(entry.usage_output_tokens || 0)}</b></span>
            ${entry.last_status ? `<span>最近状态 <b>${esc(entry.last_status)}</b></span>` : ''}
            ${entry.last_used_at ? `<span>最近使用 <b>${esc(fmtTime(entry.last_used_at))}</b></span>` : ''}
          </div>
        </div>`;
    }

    function showClientKeyUsageByChannel(key) {
      const entry = S.clientKeys.find(e => e.key === key);
      if (!entry) return;
      openModal({
        title: `分渠道用量 — ${esc(entry.name || maskKey(entry.key))}`,
        body: `
          <div class="table-wrap"><table class="tbl">
            <thead><tr><th>渠道</th><th class="num">请求</th><th class="num">错误</th><th class="num">输入</th><th class="num">输出</th><th>最近使用</th></tr></thead>
            <tbody>
              ${(entry.usage_by_channel || []).map(row => `
                <tr>
                  <td>${esc(row.channel)}</td>
                  <td class="num">${fmtCompact(row.usage_count)}</td>
                  <td class="num">${fmtCompact(row.usage_errors)}</td>
                  <td class="num">${fmtCompact(row.usage_input_tokens)}</td>
                  <td class="num">${fmtCompact(row.usage_output_tokens)}</td>
                  <td class="fs12 faint">${esc(row.last_used_at ? fmtTime(row.last_used_at) : '—')}</td>
                </tr>`).join('')}
            </tbody>
          </table></div>`,
        foot: `<button class="btn ghost" data-act="modal-close">关闭</button>`,
      });
    }

    function pickerHtml(idPrefix, items, selected, { mono = false } = {}) {
      const set = new Set(selected || []);
      return `
        <div class="picker-toolbar">
          <button class="btn outline sm" type="button" data-pick="${idPrefix}:all">全选</button>
          <button class="btn outline sm" type="button" data-pick="${idPrefix}:none">清空</button>
          <span class="sub" id="${idPrefix}Summary">已选 ${set.size}（空 = 不限制）</span>
        </div>
        <div class="picker" id="${idPrefix}List">
          ${items.length ? items.map(item => `
            <label class="check"><input type="checkbox" value="${esc(item.value)}" ${set.has(item.value) ? 'checked' : ''}>
              <span class="${mono ? 'mono' : ''}">${esc(item.label)}</span></label>`).join('')
            : '<div class="fs12 faint" style="padding:4px 2px">暂无可选项</div>'}
        </div>`;
    }

    function wirePicker(modalRoot, idPrefix) {
      const list = modalRoot.querySelector(`#${idPrefix}List`);
      const summary = modalRoot.querySelector(`#${idPrefix}Summary`);
      const update = () => {
        const n = list.querySelectorAll('input:checked').length;
        summary.textContent = `已选 ${n}（空 = 不限制）`;
      };
      list.addEventListener('change', update);
      modalRoot.querySelectorAll(`[data-pick^="${idPrefix}:"]`).forEach(btn => {
        btn.addEventListener('click', () => {
          const checked = btn.dataset.pick.endsWith(':all');
          list.querySelectorAll('input').forEach(cb => { cb.checked = checked; });
          update();
        });
      });
      return () => [...list.querySelectorAll('input:checked')].map(cb => cb.value);
    }

    function openClientKeyGenerator() {
      const { channelItems, modelItems } = scopePickerItems();
      openModal({
        title: '生成调用 Key',
        wide: true,
        body: `
          <div class="grid cols-2 modal-grid-2">
            <div class="field"><label>数量（1-100）</label><input class="input" id="ckCount" type="number" min="1" max="100" value="1"></div>
            <div class="field"><label>Key 前缀</label><input class="input mono" id="ckPrefix" value="key" placeholder="key"><div class="hint">生成形如 前缀-随机串 的 Key，同时用作名称。</div></div>
          </div>
          <div class="grid cols-2 modal-grid-2">
            <div class="field"><label>调用额度（0 = 不限）</label><input class="input" id="ckQuota" type="number" min="0" value="0"></div>
            <div class="field"><label>过期时间（留空 = 永久）</label><input class="input" id="ckExpires" type="datetime-local"></div>
          </div>
          <div class="field"><label>允许的渠道</label>${pickerHtml('ckCh', channelItems, [])}</div>
          <div class="field"><label>允许的模型</label>${pickerHtml('ckMd', modelItems, [], { mono: true })}</div>
          <div id="ckResult"></div>`,
        foot: `
          <button class="btn ghost" data-act="modal-close">取消</button>
          <button class="btn outline" id="ckManual">${ic('plus')} 手动添加</button>
          <button class="btn primary" id="ckGenerate">${ic('zap')} 批量生成</button>`,
      });
      const getChannels = wirePicker(modalBox, 'ckCh');
      const getModels = wirePicker(modalBox, 'ckMd');
      $('#ckGenerate').onclick = async () => {
        const count = Math.min(Math.max(Number($('#ckCount').value) || 1, 1), 100);
        $('#ckGenerate').disabled = true;
        try {
          const d = await api('/api/config/client-keys/generate', {
            method: 'POST',
            body: JSON.stringify({
              count,
              prefix: $('#ckPrefix').value.trim() || 'key',
              allowed_channels: getChannels(),
              allowed_models: getModels(),
              quota_limit: Math.max(0, Number($('#ckQuota').value) || 0),
              expires_at: datetimeLocalToIso($('#ckExpires').value),
            }),
          });
          if (d.ok === false) { toast(d.error || '生成失败', false); $('#ckGenerate').disabled = false; return; }
          S.clientKeys = d.api_keys || S.clientKeys;
          toast(`已生成 ${d.keys?.length || count} 个调用 Key`);
          $('#ckResult').innerHTML = `
            <div class="field" style="margin-top:4px"><label>生成结果（请立即保存）</label>
              <textarea class="input mono" id="ckResultText" style="min-height:110px" readonly>${esc((d.keys || []).join('\n'))}</textarea>
            </div>
            <button class="btn outline sm" id="ckCopyResult">${ic('copy')} 复制全部</button>`;
          $('#ckCopyResult').onclick = () => copyText((d.keys || []).join('\n'));
          $('#ckGenerate').disabled = false;
          renderApp();
        } catch (e) {
          toast(`生成失败: ${e.message}`, false);
          $('#ckGenerate').disabled = false;
        }
      };
      $('#ckManual').onclick = async () => {
        const key = await promptBox('输入要添加的调用 Key：', { title: '手动添加调用 Key' });
        if (!key || !key.trim()) return;
        await saveClientKey({
          key: key.trim(),
          name: '',
          allowed_channels: getChannels(),
          allowed_models: getModels(),
          quota_limit: Math.max(0, Number($('#ckQuota').value) || 0),
          quota_used: 0,
          expires_at: datetimeLocalToIso($('#ckExpires').value),
          enabled: true,
        }, '已添加调用 Key');
      };
    }

    function openClientKeyEditor(key) {
      const entry = S.clientKeys.find(e => e.key === key);
      if (!entry || entry.key_type === 'admin') return;
      const { channelItems, modelItems } = scopePickerItems();
      openModal({
        title: `编辑调用 Key — ${esc(maskKey(entry.key))}`,
        wide: true,
        body: `
          <div class="grid cols-2 modal-grid-2">
            <div class="field"><label>名称</label><input class="input" id="ceName" value="${esc(entry.name || '')}" placeholder="备注名"></div>
            <div class="field"><label>状态</label>
              <label class="check" style="margin-top:8px"><input type="checkbox" id="ceEnabled" ${entry.enabled === false ? '' : 'checked'}> 启用该 Key</label>
            </div>
          </div>
          <div class="grid cols-2 modal-grid-2">
            <div class="field"><label>调用额度（0 = 不限）</label><input class="input" id="ceQuota" type="number" min="0" value="${esc(entry.quota_limit || 0)}">
              <div class="hint">已用 ${fmtNum(entry.quota_used || 0)}，保存时可重置。</div></div>
            <div class="field"><label>过期时间（留空 = 永久）</label><input class="input" id="ceExpires" type="datetime-local" value="${esc(toDatetimeLocalValue(entry.expires_at))}"></div>
          </div>
          <label class="check" style="margin-bottom:10px"><input type="checkbox" id="ceResetUsed"> 重置已用额度为 0</label>
          <div class="field"><label>允许的渠道</label>${pickerHtml('ceCh', channelItems, entry.allowed_channels || [])}</div>
          <div class="field"><label>允许的模型</label>${pickerHtml('ceMd', modelItems, entry.allowed_models || [], { mono: true })}</div>`,
        foot: `
          <button class="btn ghost" data-act="modal-close">取消</button>
          <button class="btn primary" id="ceSave">${ic('check')} 保存</button>`,
      });
      const getChannels = wirePicker(modalBox, 'ceCh');
      const getModels = wirePicker(modalBox, 'ceMd');
      $('#ceSave').onclick = () => saveClientKey({
        key: entry.key,
        name: $('#ceName').value.trim(),
        allowed_channels: getChannels(),
        allowed_models: getModels(),
        quota_limit: Math.max(0, Number($('#ceQuota').value) || 0),
        quota_used: $('#ceResetUsed').checked ? 0 : (entry.quota_used || 0),
        expires_at: datetimeLocalToIso($('#ceExpires').value),
        enabled: $('#ceEnabled').checked,
      }, '调用 Key 已更新');
    }

    async function saveClientKey(payload, okMsg) {
      try {
        const d = await api('/api/config/client-keys/save', { method: 'POST', body: JSON.stringify(payload) });
        if (d.ok === false) { toast(d.error || '保存失败', false); return; }
        S.clientKeys = d.api_keys || S.clientKeys;
        toast(okMsg);
        closeModal();
        renderApp();
      } catch (e) {
        toast(`保存失败: ${e.message}`, false);
      }
    }

    async function toggleClientKey(key) {
      const entry = S.clientKeys.find(e => e.key === key);
      if (!entry || entry.key_type === 'admin') return;
      await saveClientKey({
        key: entry.key,
        name: entry.name || '',
        allowed_channels: entry.allowed_channels || [],
        allowed_models: entry.allowed_models || [],
        quota_limit: entry.quota_limit || 0,

       View: Logs
       ============================================================ */
    function logClass(entry) {
      const event = entry.event || '';
      if (entry.autoTruncated) return 'log-warn';
      if (Number(entry.statusCode) >= 400) return 'log-err';
      if (event.includes('error') || event.includes('not_found') || event.includes('rejected') || event.includes('invalid')) return 'log-err';
      if (event.includes('filtered') || event.includes('timeout') || event.includes('partial')) return 'log-warn';
      return '';
    }

    function logModel(entry = {}) { return entry.model || entry.requestedModel || entry.upstreamModel || entry.realModel || '-'; }
    function logChannel(entry = {}) { return entry.channel || entry.channelKey || '-'; }
    function logInputTokens(entry = {}) { return Number(entry.inputTokens ?? entry.promptTokens ?? entry.input_tokens) || 0; }
    function logOutputTokens(entry = {}) { return Number(entry.outputTokens ?? entry.completionTokens ?? entry.output_tokens) || 0; }

    function logStatusLabel(entry = {}) {
      if (entry.autoTruncated) return '截断';
      const status = entry.statusCode != null ? String(entry.statusCode) : '';
      const cls = logClass(entry);
      if (cls === 'log-err') return status || '失败';
      if (cls === 'log-warn') return status || '警告';
      return status || '成功';
    }

    function logSummary(entry = {}) {
      const fields = [
        entry.errorMessage,
        entry.error,
        entry.responseBody,
        entry.outputContent,
        entry.upstreamHost && entry.upstreamPath ? `${entry.upstreamHost}${entry.upstreamPath}` : '',
        entry.url,
      ];
      const summary = fields.find(v => v != null && String(v).trim());
      return summary ? String(summary).replace(/\s+/g, ' ').slice(0, 260) : '-';
    }

    function openLogDetail(idx) {
      const entry = S.logs[idx];
      if (!entry) return;
      const preferred = ['timestamp', 'event', 'requestId', 'model', 'requestedModel', 'upstreamModel', 'channel', 'channelKey', 'statusCode', 'inputTokens', 'outputTokens', 'totalTokens', 'tokens', 'cacheReadInputTokens', 'cacheCreationInputTokens', 'clientIp', 'ip', 'durationMs', 'upstreamHost', 'upstreamPath', 'errorMessage', 'error'];
      const seen = new Set();
      const items = [];
      const pushItem = (label, value) => {
        if (value == null || value === '' || typeof value === 'object') return;
        items.push(`<div class="log-detail-item"><span>${esc(label)}</span><b>${esc(String(value))}</b></div>`);
      };
      for (const k of preferred) { if (k in entry) { seen.add(k); pushItem(k, entry[k]); } }
      for (const [k, v] of Object.entries(entry)) { if (!seen.has(k)) pushItem(k, v); }
      const raw = JSON.stringify(entry, null, 2);
      openModal({
        title: `日志详情 — ${esc(entry.event || '-')}`,
        wide: true,
        body: `
          <div class="log-detail-grid" style="margin-bottom:12px">${items.join('')}</div>
          <div class="field"><label>原始 JSON</label><div class="json-box" id="logRawJson">${esc(raw)}</div></div>`,

      });
      $('#logCopyJson').onclick = () => copyText(raw);
    }

          <div class="fs12 faint" style="margin-bottom:10px">最多显示在侧栏「网站入口」区域；地址不带协议时自动补 https://。</div>
          <div id="wbRows">${S.websiteButtons.map(b => rowHtml(b)).join('') || rowHtml()}</div>
          <button class="btn outline sm" id="wbAdd">${ic('plus')} 添加一行</button>`,
        foot: `
          <button class="btn ghost" data-act="modal-close">取消</button>
          <button class="btn primary" id="wbSave">${ic('check')} 保存</button>`,
      });
      $('#wbAdd').onclick = () => $('#wbRows').insertAdjacentHTML('beforeend', rowHtml());
      $('#wbRows').addEventListener('click', e => {
        const del = e.target.closest('.wb-del');
        if (del) del.closest('.wb-row').remove();
      });
      $('#wbSave').onclick = async () => {
        const buttons = [...modalBox.querySelectorAll('.wb-row')].map(row => ({
          name: row.querySelector('.wb-name').value.trim(),
          url: row.querySelector('.wb-url').value.trim(),
        })).filter(b => b.name && b.url);
        try {
          const d = await api('/api/config/website-buttons/save', { method: 'POST', body: JSON.stringify({ website_buttons: buttons }) });
          if (d.ok === false) { toast(d.error || '保存失败', false); return; }
          S.websiteButtons = d.website_buttons || buttons;
          toast('网站按钮已保存');
          closeModal();
          renderApp();
        } catch (e) {
          toast(`保存失败: ${e.message}`, false);
        }
      };
    }

    async function exportBackupAction() {
      const g = globalAgg();
      if (!await confirmBox(`导出完整备份？将包含 ${g.channels} 个渠道（含全部上游 Key）、调用 Key 列表和统计数据。`, { title: '导出备份' })) return;
      try {
        await downloadAuthed('/api/config/export', 'gateway-backup.json');
        toast('备份已导出');
      } catch (e) {
        toast(`导出失败: ${e.message}`, false);
      }
    }

    async function handleBackupFile(e) {
      const file = e.target.files?.[0];
      e.target.value = '';
      if (!file) return;
      let data;
      try {
        data = JSON.parse(await file.text());
      } catch {
        toast('备份文件不是有效的 JSON', false);
        return;
      }
      const isV2 = data && data.backup_version === 2 && data.config;
      const cfg = isV2 ? data.config : data;
      if (!cfg || typeof cfg.channels !== 'object' || !cfg.channels) {
        toast('备份文件缺少 channels', false);
        return;
      }
      const channelCount = Object.keys(cfg.channels).length;
      const modelCount = Object.values(cfg.channels).reduce((sum, ch) => sum + (ch.models?.length || 0), 0);
      const ok = await confirmBox(
        `导入备份将覆盖当前全部配置：${channelCount} 个渠道 · ${modelCount} 个模型${isV2 && data.stats ? ' · 含统计数据' : ''}。确定继续？`,
        { danger: true, okText: '导入' },
      );
      if (!ok) return;
      try {
        const d = await api('/api/config/import', { method: 'POST', body: JSON.stringify(data) });
        if (d.ok === false) { toast(d.error || '导入失败', false); return; }
        if (cfg.api_key && isSafeHeaderValue(String(cfg.api_key))) saveKey(String(cfg.api_key));
        toast('备份已导入');
        await refreshAll({ withLogs: S.route === 'logs' });
        renderApp();
      } catch (e2) {
        toast(`导入失败: ${e2.message}`, false);
      }
    }

    /* ============================================================
       Global event delegation
       ============================================================ */
    document.addEventListener('click', e => {
      const copyEl = e.target.closest('[data-copy]');
      if (copyEl && !e.target.closest('[data-krow],[data-ck]')) {
        void copyText(copyEl.dataset.copy);
        return;
      }
      const navEl = e.target.closest('[data-nav]');
      if (navEl) {
        nav(navEl.dataset.nav, navEl.dataset.arg || '');
        return;
      }
      const actEl = e.target.closest('[data-act]');
      if (!actEl) return;
      const ckey = actEl.dataset.ckey || S.routeArg;
      switch (actEl.dataset.act) {
        case 'modal-close': return closeModal();
        case 'toggle-theme':
          S.theme = S.theme === 'light' ? 'dark' : 'light';
          applyTheme();
          renderApp();
          return;
        case 'logout':
          void confirmBox('退出登录？管理 Key 将从本浏览器移除。').then(ok => {
            if (!ok) return;
            saveKey('');
            S.authed = false;
            renderApp();
          });
          return;
        case 'global-refresh':
          void refreshAll({ withLogs: S.route === 'logs' }).then(() => {
            if (S.route === 'channels' && S.routeArg) void loadKeyDash(S.routeArg);
            renderApp();
            toast('已刷新');
          }).catch(err => toast(`刷新失败: ${err.message}`, false));
          return;
        case 'channel-new': return openChannelEditor('');
        case 'channel-edit': return openChannelEditor(ckey);
        case 'channel-test': return void testChannelAction(ckey);
        case 'channel-toggle': return void toggleChannelAction(ckey);
        case 'channel-delete': return void deleteChannelAction(ckey);
        case 'clientkey-generate': return openClientKeyGenerator();
        case 'clientkey-copy-all': {
          const keys = S.clientKeys.filter(k => k.key_type !== 'admin').map(k => k.key);
          if (!keys.length) { toast('还没有生成的调用 Key', false); return; }
          void copyText(keys.join('\n'));
          return;
        }
        case 'logs-refresh': return void loadLogsAndRender(S.logPage).then(() => toast('已刷新'));
        case 'logs-clear': return void clearLogsAction();
        case 'stats-refresh':
          return void loadStats().then(() => { renderView(); toast('已刷新'); }).catch(err => toast(`刷新失败: ${err.message}`, false));
        case 'stats-reset': return void resetStatsAction();
        case 'admin-key-change': return openAdminKeyModal();
        case 'website-buttons-edit': return openWebsiteButtonsModal();
        case 'backup-export': return void exportBackupAction();
        case 'backup-import': return $('#backupFileInput')?.click();
      }
    });

    /* ============================================================
       Boot
       ============================================================ */
    async function boot(fromLogin = false) {
      if (!S.key) {
        S.authed = false;
        renderApp();
        return;
      }
      try {
        await loadConfig();          // 401 here → handleUnauthorized → login screen
      } catch (e) {
        if (fromLogin) throw e;      // login flow reports the error inline
        if (e.status === 401) return; // stale stored key: login screen already rendered
        // Non-auth failure (e.g. gateway briefly down): show app shell with error toast.
        toast(`加载配置失败: ${e.message}`, false);
      }
      S.authed = true;
      await loadStats().catch(() => { S.stats = null; });
      const { route, arg } = parseHash();
      S.route = route;
      S.routeArg = arg;
      if (route === 'channels' && arg) void loadKeyDash(arg);
      if (route === 'logs') void loadLogs(1).then(() => { if (S.route === 'logs') renderView(); }).catch(() => {});
      renderApp();
    }

    applyTheme();
    void boot();
  </script>
</body>

</html>
